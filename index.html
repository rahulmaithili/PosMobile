          </div>

          <div className="settings-shell">
            <nav className="settings-nav">
              {SECTIONS.map(s => (
                <button key={s.key} className={'settings-nav-item' + (section === s.key ? ' active' : '')} onClick={() => setSection(s.key)}>
                  <i className={'fas ' + s.icon}></i><span>{s.label}</span>
                  {s.keys.length > 0 && dirty(s.keys) && <span className="dot" title="Unsaved changes"></span>}
                </button>
              ))}
            </nav>

            <div className="settings-panel">
              {!shop && <div className="settings-card"><div className="settings-card-body"><FormSkeleton rows={6} /></div></div>}
              {shop && section === 'shop_profile' && (
                <SettingsCard s={cur} isDirty={dirty(cur.keys)} canEditShop={canEditShop} dis={dis} onSave={() => saveSection(cur.keys)}>
                  <div className="settings-logo-row" style={{marginBottom:'16px'}}>
                    <img className="settings-logo-preview" src={f.shop_logo || LOGO_URL} alt="Logo" />
                    <div className="form-group" style={{margin:0, flex:'1 1 240px'}}>
                      <label><i className="fas fa-image"></i> Shop logo</label>
                      <input type="file" className="file-input" accept="image/*" onChange={handleLogo} disabled={dis} />
                      <small style={{color:'#778'}}>Shown on sidebar, login & receipts. Uploads & saves immediately.</small>
                    </div>
                  </div>
                  <div className="form-grid">
                    <div className="form-group"><label><i className="fas fa-shop"></i> Shop Name</label><input type="text" value={f.shop_name || ''} onChange={(e) => set('shop_name', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-tag"></i> Tagline</label><input type="text" value={f.shop_tagline || ''} onChange={(e) => set('shop_tagline', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-location-dot"></i> Address</label><input type="text" value={f.shop_address || ''} onChange={(e) => set('shop_address', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-city"></i> City</label><input type="text" value={f.shop_city || ''} onChange={(e) => set('shop_city', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-flag"></i> Country</label><input type="text" value={f.shop_country || ''} onChange={(e) => set('shop_country', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-phone"></i> Phone</label><input type="text" value={f.shop_phone || ''} onChange={(e) => set('shop_phone', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-envelope"></i> Email</label><input type="email" value={f.shop_email || ''} onChange={(e) => set('shop_email', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-globe"></i> Website</label><input type="text" value={f.shop_website || ''} onChange={(e) => set('shop_website', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-id-card"></i> Tax / VAT No.</label><input type="text" value={f.tax_id || ''} onChange={(e) => set('tax_id', e.target.value)} disabled={dis} /></div>
                  </div>
                </SettingsCard>
              )}
              {shop && section === 'localization' && (
                <SettingsCard s={cur} isDirty={dirty(cur.keys)} canEditShop={canEditShop} dis={dis} onSave={() => saveSection(cur.keys)}>
                  <div className="form-grid">
                    <div className="form-group" style={{gridColumn:'1 / -1'}}>
                      <label><i className="fas fa-coins"></i> Select Currency</label>
                      <select className="swal2-select" style={{width:'100%', margin:0, background:'rgba(255,255,255,0.05)', color:'#fff', border:'1px solid rgba(255,255,255,0.2)', borderRadius:'6px', padding:'10px'}}
                              value={f.currency_code || ''} disabled={dis}
                              onChange={(e) => {

                    </div>

                    <div className="form-group"><label><i className="fas fa-percent"></i> Default VAT %</label><input type="number" step="0.01" value={f.vat_default ?? ''} onChange={(e) => set('vat_default', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-triangle-exclamation"></i> Low Stock Alert</label><input type="number" value={f.low_stock_default ?? ''} onChange={(e) => set('low_stock_default', e.target.value)} disabled={dis} /></div>
                    <div className="form-group"><label><i className="fas fa-clock"></i> Timezone</label><SearchableDropdown options={tzOpts} value={f.timezone || ''} onChange={(v) => set('timezone', v)} placeholder="Timezone" /></div>
                    <div className="form-group"><label><i className="fas fa-calendar"></i> Date Format</label><SearchableDropdown options={dateOpts} value={f.date_format || 'YYYY-MM-DD'} onChange={(v) => set('date_format', v)} placeholder="Date format" /></div>

    // Roles & Permissions matrix editor — owner row locked
    function PermissionsMatrixView({ userId }) {
      const [matrix, setMatrix] = useState(null);
      const [busy, setBusy] = useState('');
      const PERMS = ['v', 'a', 'e', 'd'];
      const LBL = { v: 'V', a: 'A', e: 'E', d: 'D' };
      const TITLE = { v: 'View', a: 'Add', e: 'Edit', d: 'Delete' };

      function load() {
        gsRun('getRbacMatrix', userId).then(r => {
          r.success ? setMatrix(r) : Swal.fire({ icon: 'error', title: 'Access', text: r.message });
        });
      }
      const reload = () => load();
      useEffect(() => { load(); }, []);

      function toggle(role, page, perm, on) {
        if (role.is_super) return;
        setBusy('Saving…');
        gsRun('toggleRbac', role.key, page.key, perm, on ? 0 : 1, userId).then(r => {
          setBusy('');
          r.success ? reload() : Swal.fire({ icon: 'error', title: 'Error', text: r.message });
        });
      }

      function grouped() {
        const order = [], map = {};
        (matrix.pages || []).forEach(p => {
          const g = p.group || 'General';
          if (!map[g]) { map[g] = []; order.push(g); }
          map[g].push(p);
        });
        return order.map(g => ({ group: g, pages: map[g] }));
      }

      const roles = matrix ? matrix.roles : [];
      const colCount = 1 + roles.length * 4;

      return (
        <div className="data-section">
          <LoadingPopup text={busy} />
          <div className="section-header" style={{ marginBottom: '6px' }}>
            <h2 style={{ display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--navy-primary)', margin: 0 }}>
              <i className="fas fa-user-shield"></i> Roles &amp; Permissions
            </h2>
          </div>
          <p className="rbac-perm-legend" style={{ marginBottom: '12px', color:'#789', fontSize:'13px' }}>
            V=view A=add E=edit D=delete · Owner is locked
          </p>

          {!matrix ? <TableSkeleton rows={6} columns={5} /> : (
            <div className="rbac-wrap">
              <table className="rbac-table">
                <thead>
                  <tr>
                    <th className="rbac-pagecol" rowSpan={2}>Page</th>
                    {roles.map(role => (
                      <th key={role.key} colSpan={4}>
                        <span className="rbac-rolehead" style={{ background: role.color || 'var(--navy-primary)', color:'#fff', padding:'2px 10px', borderRadius:'3px', fontSize:'12px', fontWeight:700 }}>
                          {role.label}{role.is_super ? ' 🔒' : ''}
                        </span>
                      </th>
                    ))}
                  </tr>
                  <tr>
                    {roles.map(role => PERMS.map(p => (
                      <th key={role.key + p} title={TITLE[p]} style={{ fontSize: '10px', color: '#8795a3' }}>{LBL[p]}</th>
                    )))}
                  </tr>
                </thead>
                <tbody>
                  {grouped().map(grp => (
                    <React.Fragment key={grp.group}>
                      <tr className="rbac-grouprow"><td colSpan={colCount}>{grp.group}</td></tr>
                      {grp.pages.map(page => (
                        <tr key={page.key}>
                          <td className="rbac-pagecol">{page.label}</td>
                          {roles.map(role => {
                            const pp = (matrix.perms[role.key] && matrix.perms[role.key][page.key]) || {};
                            const locked = !!role.is_super;
                            return PERMS.map(perm => {
                              const on = locked ? true : pp[perm] === 1;
                              return (
                                <td key={role.key + page.key + perm}>
                                  <span
                                    className={'rbac-dot' + (on ? ' on' : '') + (locked ? ' locked' : '')}
                                    title={role.label + ' · ' + TITLE[perm]}
                                    onClick={() => toggle(role, page, perm, on)}
                                  >{LBL[perm]}</span>
                                </td>
                              );
                            });
                          })}
                        </tr>
                      ))}
                    </React.Fragment>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

      // every calculation in the app
      const FORMULAS = [
        { what:'Pricing model',     logic:'Product prices are NET; VAT added on top per line', where:'All sales / POS' },
        { what:'Line VAT',          logic:'round(unit_price × qty × vat_rate / 100, 2)', where:'POS cart, sale_items' },

        { what:'Sale void',         logic:'same-day only (≤ void_window_hours), blocked once returns exist; restores stock + reverses tenders', where:'POS (void sale)' },
        { what:'Low-stock flag',    logic:'stock_qty ≤ low_stock_alert', where:'Dashboard, Products' },
        { what:'Inventory value',   logic:'Σ (stock_qty × purchase_price)  — at cost', where:'Dashboard KPI' },
        { what:'VAT toggle',        logic:'enable_vat = "0" → new sale lines recorded at 0% VAT (total/VAT follow)', where:'Settings, POS' },
        { what:'Loyalty earned',    logic:'floor((total − redeem_value) / loyalty_earn_per) — customer + loyalty on; not on points-funded spend', where:'POS checkout' },
        { what:'Loyalty redeem (tender)', logic:'redeem_value = min(req, balance, floor(total / point_value)) × point_value — reduces amount due, NOT revenue/VAT', where:'POS checkout' },
        { what:'Store credit (tender)', logic:'applied = min(req, balance, due) — paid like cash; decrements store_credit', where:'POS / Record Payment' },
        { what:'Due after tenders', logic:'due = max(0, total − redeem_value − store_credit_applied − cash_applied); change only from cash', where:'POS checkout' },
        { what:'Return refund VAT', logic:'refund_vat = line_vat × (1 − discount/gross)  (mirrors sale vatNet)', where:'Returns' },
        { what:'Return refund total', logic:'refund_total = (returned_net + returned_vat) − discount_share', where:'Returns' },
        { what:'Refund due-offset', logic:'due_applied = min(refund_total, sale.due); cash_refunded = refund_total − due_applied', where:'Returns' },
        { what:'Return restock',    logic:'restock=1 ⇒ stock += qty + movement(return) + COGS reversed; restock=0 ⇒ COGS kept (write-off)', where:'Returns' },
        { what:'Store credit (issue)', logic:'customer.store_credit += cash_refunded  (store_credit refund method)', where:'Returns' },
        { what:'Customer outstanding', logic:'Σ sales.due_amount (partial/unpaid) + Σ repairs.remaining_amount', where:'Customer Statement' },
        { what:'Gross profit',      logic:'(sales_revenue − VAT − COGS), NET of returns', where:'Reports P&L' },
        { what:'Repair income',     logic:'Σ paid_amount in range  (cash basis)', where:'Reports' },
        { what:'Repair profit',     logic:'repair_income − Σ repair.parts_cost', where:'Reports P&L' },
        { what:'Expenses total',    logic:'Σ expense.amount where date ∈ range (excludes soft-deleted)', where:'Expenses, Reports' },
        { what:'Net profit',        logic:'sales_gross_profit + repair_profit − expenses_total', where:'Reports P&L' },
        { what:'Receipt logo',      logic:'print shop_logo when show_logo_on_receipt = "1"', where:'Receipts / Tickets / Contracts' },
        { what:'Doc numbering',     logic:'invoice_no=invoice_prefix+pad(id) · ticket_no=repair_prefix+pad(id) · contract_no=used_prefix+pad(id)', where:'Receipts' },
        { what:'WhatsApp trigger',  logic:'wa.me link built when a repair status transitions to "repaired"', where:'Repairs' },
        { what:'IMEI history',      logic:'match = exact trimmed string on Used_Phones.imei OR Repairs.device_imei; merged & sorted ascending by created (oldest → newest)', where:'IMEI Lookup' },
        { what:'Suggested resale price', logic:'round(base_market_value × avg(mult[screen_condition], mult[battery_grade], mult[body_condition]), 2), mult A=1.00/B=0.85/C=0.70/D=0.50 — pre-fills resale_price, stays editable and is never overwritten once staff types a value', where:'Buy Used Phone' },

        { what:'Till expected cash',  logic:'expected_cash = opening_float + Σ cash tendered on new Sales (amount_paid − redeem_value − store_credit_applied, payment_method="cash") + Σ cash rows from the Payments ledger (covers sale top-ups, repair payments, installment down payments/mirrors) − Σ cash refunds (Returns.cash_refunded where refund_method="cash") − Σ cash Expenses.amount where payment_method="cash" — all strictly between till opened_at and now', where:'Cash Drawer (Close Till)' },

        { what:'Installment reconciliation', logic:'every call to applySalePayment_ (direct POS/Customer Ledger payment, installment down payment, or installment mirror) ends with reconcileInstallments_(): pending Installments rows for that sale are trued up oldest-due-first against the sale\'s real due_amount, so a direct "Record Payment" on the sale also settles/reduces its installment schedule and the two ledgers can never drift apart', where:'applySalePayment_ (all payment entry points)' }
      ];

      return (

    function CashDrawerView({ userId, role, perms }) {
      const canAdd = can(perms, 'cash_drawer', 'a'), canEdit = can(perms, 'cash_drawer', 'e');
      const { data: res, mutate } = useSWR('cash_drawer:status', () => gsRun('getCashDrawerStatus', userId), { revalidateOnFocus:false });
      const data = res && res.success ? res.data : undefined;
      const open = data ? data.open : undefined;
      const history = data ? data.history : undefined;
      const [showOpen, setShowOpen] = useState(false);
      const [showClose, setShowClose] = useState(false);
      const [busy, setBusy] = useState('');

      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Access', text:res.message }); }, [res]);

      const cols = [
        { data:'id', title:'ID' },
        { data:'opened_by_name', title:'Opened By', render:(d) => esc(d) },
        { data:'created', title:'Opened At', render:(d) => fmtDate(d) },
        { data:'closed_by_name', title:'Closed By', render:(d) => esc(d) },
        { data:'closed_at', title:'Closed At', render:(d) => fmtDate(d) },
        { data:'opening_float', title:'Opening Float', render:(v) => money(v) },
        { data:'expected_cash', title:'Expected', render:(v) => money(v) },
        { data:'counted_cash', title:'Counted', render:(v) => money(v) },
        { data:'variance', title:'Variance', render:(v) => '<span style="font-weight:700;color:' + (Number(v) < 0 ? '#b91c1c' : '#2e7d32') + '">' + money(v) + '</span>' },
        { data:'status', title:'Status', render:(d) => statusPill(d) }
      ];
      useDataTable('cashDrawerTable', history, cols, { onRefresh:() => mutate(), dt:{ order:[[2,'desc']], createdRow:(tr, row) => { if (Number(row.variance) < 0) tr.classList.add('row-danger'); } } });

      const doOpen = (openingFloat) => {
        setBusy('Opening till…');
        gsRun('openTill', openingFloat, userId).then(r => {
          setBusy('');
          if (r.success) { setShowOpen(false); Swal.fire({ icon:'success', title:r.message, timer:1100, showConfirmButton:false }); mutate(); }
          else Swal.fire({ icon:'error', title:'Error', text:r.message });
        });
      };
      const doClose = (form) => {
        setBusy('Closing till…');
        gsRun('closeTill', open.id, form.counted_cash, form.notes, userId).then(r => {
          setBusy('');
          if (r.success) { setShowClose(false); Swal.fire({ icon:'success', title:r.message, timer:1300, showConfirmButton:false }); mutate(); }
          else Swal.fire({ icon:'error', title:'Error', text:r.message });
        });
      };

      return (
        <div className="data-section">
          <LoadingPopup text={busy} />
          <div className="section-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px', flexWrap:'wrap', gap:'10px'}}>
            <h2 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', margin:0}}><i className="fas fa-sack-dollar"></i> Cash Drawer</h2>
            <div style={{display:'flex', gap:'10px'}}>
              {data !== undefined && !open && canAdd && <button className="btn btn-primary" onClick={() => setShowOpen(true)}><i className="fas fa-lock-open"></i> Open Till</button>}
              {data !== undefined && open && canEdit && <button className="btn btn-primary" onClick={() => setShowClose(true)}><i className="fas fa-lock"></i> Close Till</button>}
            </div>
          </div>

          <div className="lte-kpi-grid" style={{marginBottom:'14px'}}>
            <SmallBox value={data === undefined ? '…' : (open ? 'OPEN' : 'CLOSED')} label="Till Status" icon={open ? 'fa-lock-open' : 'fa-lock'} color={open ? 'bg-success' : 'bg-navy'} />
            {open && <InfoBox value={money(open.opening_float)} label="Opening Float" icon="fa-coins" color="bg-info" />}
            {open && <InfoBox value={open.opened_by_name} label={'Opened ' + fmtDate(open.created)} icon="fa-user-clock" color="bg-warning" />}
            {open && <InfoBox value={money(open.expected_cash)} label="Expected Cash Now" icon="fa-calculator" color="bg-navy" />}
          </div>

          <h3 style={{color:'var(--navy-primary)', margin:'20px 0 10px', display:'flex', alignItems:'center', gap:'8px'}}><i className="fas fa-clock-rotate-left"></i> Till History</h3>
          {history === undefined ? <TableSkeleton rows={6} columns={10} /> : <table id="cashDrawerTable" className="display" style={{width:'100%'}}></table>}

          {showOpen && <OpenTillModal onClose={() => setShowOpen(false)} onSave={doOpen} />}
          {showClose && open && <CloseTillModal session={open} userId={userId} onClose={() => setShowClose(false)} onSave={doClose} />}
        </div>
      );
    }
    function OpenTillModal({ onClose, onSave }) {
      const [flt, setFlt] = useState('');
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'420px'}}>
            <div className="modal-header"><h3><i className="fas fa-lock-open"></i> Open Till</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={(e) => { e.preventDefault(); if (flt === '' || isNaN(Number(flt)) || Number(flt) < 0) { Swal.fire({ icon:'warning', title:'Enter a valid opening float' }); return; } onSave(Number(flt)); }}>
                <div className="form-grid">
                  <div className="form-group" style={{gridColumn:'1 / -1'}}><label><i className="fas fa-coins"></i> Opening Float *</label><input type="number" step="0.01" min="0" value={flt} onChange={(e) => setFlt(e.target.value)} autoFocus required /></div>
                </div>
                <div className="form-actions"><button type="submit" className="btn btn-primary"><i className="fas fa-lock-open"></i> Open Till</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
              </form>
            </div>
          </div>
        </div>
      );
    }
    function CloseTillModal({ session, userId, onClose, onSave }) {
      const [expected, setExpected] = useState(session.expected_cash);
      const [loadingExp, setLoadingExp] = useState(true);
      const [counted, setCounted] = useState('');
      const [notes, setNotes] = useState('');
      // recheck live cash right before close — sales may have landed since page load
      useEffect(() => {
        gsRun('getCashDrawerStatus', userId).then(r => { if (r.success && r.data.open) setExpected(r.data.open.expected_cash); setLoadingExp(false); });
      }, []);
      const variance = round2((Number(counted) || 0) - Number(expected));
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'460px'}}>
            <div className="modal-header"><h3><i className="fas fa-lock"></i> Close Till</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={(e) => { e.preventDefault(); if (counted === '' || isNaN(Number(counted)) || Number(counted) < 0) { Swal.fire({ icon:'warning', title:'Enter counted cash' }); return; } onSave({ counted_cash:Number(counted), notes }); }}>
                <div className="form-grid">
                  <div className="form-group"><label><i className="fas fa-calculator"></i> Expected Cash</label><input type="text" value={loadingExp ? 'Calculating…' : money(expected)} disabled /></div>
                  <div className="form-group"><label><i className="fas fa-money-bill-wave"></i> Counted Cash *</label><input type="number" step="0.01" min="0" value={counted} onChange={(e) => setCounted(e.target.value)} autoFocus required /></div>
                  <div className="form-group" style={{gridColumn:'1 / -1'}}>
                    <label><i className="fas fa-scale-balanced"></i> Variance</label>
                    <input type="text" value={money(variance)} disabled style={{fontWeight:700, color: variance < 0 ? 'var(--danger)' : 'var(--success)'}} />
                  </div>
                  <div className="form-group" style={{gridColumn:'1 / -1'}}><label><i className="fas fa-note-sticky"></i> Notes</label><textarea rows="2" value={notes} onChange={(e) => setNotes(e.target.value)}></textarea></div>
                </div>
                <div className="form-actions"><button type="submit" className="btn btn-primary"><i className="fas fa-lock"></i> Close Till</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
              </form>
            </div>
          </div>
        </div>
      );
    }
    // client-built wa.me reminder — same convention as buildRepairWaLink_ server-side, staff clicks to open, never auto-sent
    function buildInstallmentWaLink(row){
      const phone = String(row.customer_phone || '').replace(/[^0-9]/g, '');
      const shop = (window.SHOP && window.SHOP.name) || 'Phone Shop';
      const due = row.due != null ? row.due : round2(Number(row.amount) - Number(row.paid_amount || 0));
      const msg = 'Hi ' + (row.customer_name || '') + ', your installment of ' + money(due) + ' for ' + (row.invoice_no || '') +
        ' was due on ' + row.due_date + '. Kindly settle it at your earliest convenience. Thank you - ' + shop;
      return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
    }
    function InstallmentsView({ userId, role, perms }) {
      const canAdd = can(perms, 'installments', 'a'), canPay = can(perms, 'installments', 'e');
      const { data: res, mutate } = useSWR('installments:all', () => gsRun('getInstallments', userId), { revalidateOnFocus:false });
      const { data: saleRes } = useSWR('installments:sales', () => gsRun('getSalesForInstallment', userId), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const saleOpts = (saleRes && saleRes.success ? saleRes.data : []).map(s => ({ value:s.id, label:s.invoice_no + ' — ' + s.customer_name + ' (due ' + money(s.due_amount) + ')' }));
      const [show, setShow] = useState(false);
      const [openKey, setOpenKey] = useState(null);   // customer whose schedule popup is open
      const [payRow, setPayRow] = useState(null);
      const [busy, setBusy] = useState('');
      const [fStatus, setFStatus] = useState('');
      const today = todayStr();

      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Access', text:res.message }); }, [res]);

      // group flat installment terms → one row per customer (whole schedule opens in a popup)
      const buildPlans = (list) => {
        if (!list) return undefined;
        const m = new Map();
        list.forEach(r => {
          const key = r.customer_id != null ? 'c' + r.customer_id : 's' + r.sale_id;
          let p = m.get(key);
          if (!p) { p = { key, customer_id:r.customer_id, customer_name:r.customer_name, customer_phone:r.customer_phone, invoices:{}, terms:[], total:0, paid:0, paidCount:0, overdueCount:0 }; m.set(key, p); }
          p.terms.push(r); p.invoices[r.invoice_no] = 1;
          p.total += Number(r.amount || 0); p.paid += Number(r.paid_amount || 0);
          if (r.status === 'paid') p.paidCount++; else if (r.status === 'overdue' || r.due_date < today) p.overdueCount++;
        });
        return [...m.values()].map(p => {
          p.terms.sort((a, b) => a.due_date < b.due_date ? -1 : (a.due_date > b.due_date ? 1 : 0));
          p.terms.forEach((t, i) => { t._term = i + 1; });
          p.count = p.terms.length; p.total = round2(p.total); p.paid = round2(p.paid); p.remaining = round2(p.total - p.paid);
          const inv = Object.keys(p.invoices); p.invoiceLabel = inv.length === 1 ? inv[0] : inv.length + ' plans';
          const next = p.terms.find(t => t.status !== 'paid');
          p.nextTerm = next || null; p.nextDue = next ? next.due_date : null;
          p.planStatus = p.paidCount >= p.count ? 'completed' : (p.overdueCount > 0 ? 'overdue' : 'active');
          return p;
        });
      };
      const plans = buildPlans(rows);
      const statusOpts = [{ value:'', label:'All Statuses' }, { value:'active', label:'Active' }, { value:'overdue', label:'Overdue' }, { value:'completed', label:'Completed' }];
      const shown = plans === undefined ? undefined : (fStatus ? plans.filter(p => p.planStatus === fStatus) : plans);
      const openPlan = plans && openKey != null ? plans.find(p => p.key === openKey) : null;
      const dueList = (rows || []).filter(r => r.status !== 'paid' && r.due_date <= today);

      const cols = [
        { data:'customer_name', title:'Customer', render:(d) => esc(d) },
        { data:'invoiceLabel', title:'Plan', render:(d) => esc(d) },
        { data:null, title:'Terms', orderable:false, render:(d, t, p) => p.paidCount + ' / ' + p.count },
        { data:'total', title:'Financed', render:(v) => money(v) },
        { data:'paid', title:'Paid', render:(v) => money(v) },
        { data:'remaining', title:'Outstanding', render:(v) => money(v) },
        { data:'nextDue', title:'Next Due', render:(d) => d ? fmtDay(d) : '—' },
        { data:'planStatus', title:'Status', render:(d) => statusPill(d) },
        { data:null, title:'Actions', orderable:false, render:(d, t, p) =>
          '<button class="action-icon" data-action="view" title="View Installments" style="color:var(--navy-accent)"><i class="fas fa-eye"></i></button>' +
          (p.nextTerm && p.customer_phone ? '<button class="action-icon" data-action="wa" title="WhatsApp Reminder" style="color:#25d366"><i class="fa-brands fa-whatsapp"></i></button>' : '') }
      ];
      const onAction = (action, p) => {
        if (action === 'view') setOpenKey(p.key);
        else if (action === 'wa' && p.nextTerm) window.open(buildInstallmentWaLink(p.nextTerm), '_blank');
      };
      useDataTable('installmentsTable', shown, cols, { onAction, onRefresh:() => mutate(),
        dt:{ order:[[0,'asc']], createdRow:(tr, p) => { if (p.planStatus === 'overdue') tr.classList.add('row-danger'); else if (p.nextDue === today) tr.classList.add('row-warn'); } } });
      const sumR = (shown || []).reduce((a, p) => ({ total:a.total + p.total, paid:a.paid + p.paid, rem:a.rem + p.remaining }), { total:0, paid:0, rem:0 });

      const [editPay, setEditPay] = useState(null);

      const createPlan = (form) => {
        setBusy('Creating plan…');
        gsRun('createInstallmentPlan', form.sale_id, form.down_payment, form.num_installments, form.method, form.interest_rate, form.interest_amount, userId).then(r => {
          setBusy('');
          if (r.success) { setShow(false); Swal.fire({ icon:'success', title:r.message, timer:1200, showConfirmButton:false }); mutate(); }
          else Swal.fire({ icon:'error', title:'Error', text:r.message });
        });
      };
      const payInstallment = (amt, method, proofUrl) => {
        setBusy('Recording payment…');
        gsRun('recordInstallmentPayment', payRow.id, amt, method, proofUrl, userId).then(r => {
          setBusy('');
          if (r.success) { setPayRow(null); Swal.fire({ icon:'success', title:r.message, timer:1200, showConfirmButton:false }); mutate(); }
          else Swal.fire({ icon:'error', title:'Error', text:r.message });
        });
      };
      const deletePayment = (paymentId) => {
        Swal.fire({
          title: 'Delete Payment?',
          text: 'This will restore the due balance on the installment plan and POS sale.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: 'var(--danger)',
          confirmButtonText: 'Delete'
        }).then(res => {
          if (res.isConfirmed) {
            setBusy('Deleting payment…');
            gsRun('deleteInstallmentPayment', paymentId, userId).then(r => {
              setBusy('');
              if (r.success) {
                Swal.fire({ icon:'success', title:r.message, timer:1100, showConfirmButton:false });
                const curKey = openKey;
                setOpenKey(null);
                setTimeout(() => setOpenKey(curKey), 100);
                mutate();
              } else {
                Swal.fire({ icon:'error', title: 'Error', text: r.message });
              }
            });
          }
        });
      };
      const saveEditPayment = (paymentId, amt, method, proof) => {
        setBusy('Updating payment…');
        gsRun('updateInstallmentPayment', paymentId, amt, method, proof, userId).then(r => {
          setBusy('');
          if (r.success) {
            setEditPay(null);
            Swal.fire({ icon:'success', title:r.message, timer:1100, showConfirmButton:false });
            const curKey = openKey;
            setOpenKey(null);
            setTimeout(() => setOpenKey(curKey), 100);
            mutate();
          } else {
            Swal.fire({ icon:'error', title: 'Error', text: r.message });
          }
        });
      };

      return (
        <div className="data-section">
          <LoadingPopup text={busy} />
          <div className="section-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px', flexWrap:'wrap', gap:'10px'}}>
            <h2 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', margin:0}}><i className="fas fa-hand-holding-dollar"></i> Installments / EMI</h2>
            {canAdd && <button className="btn btn-primary" onClick={() => setShow(true)}><i className="fas fa-plus"></i> Create Installment Plan</button>}
          </div>

          {rows !== undefined && dueList.length > 0 && (
            <div className="lte-card" style={{borderTopColor:'#c5221f', marginBottom:'20px'}}>
              <div className="lte-card-header"><h3 className="lte-card-title"><i className="fas fa-triangle-exclamation" style={{color:'#c5221f'}}></i> Due Today / Overdue ({dueList.length})</h3></div>
              <div className="lte-card-body">
                <table className="dash-mini-table"><thead><tr><th>Customer</th><th>Sale</th><th>Due</th><th>Amount</th><th></th></tr></thead>
                  <tbody>{dueList.slice(0, 10).map(r => (
                    <tr key={r.id}>
                      <td>{esc(r.customer_name)}</td><td>{esc(r.invoice_no)}</td>
                      <td style={r.due_date < today ? { color:'#b91c1c', fontWeight:600 } : {}}>{fmtDay(r.due_date)}</td>
                      <td>{money(round2(r.amount - r.paid_amount))}</td>
                      <td>{r.customer_phone && <a className="action-icon" style={{color:'#25d366'}} href={buildInstallmentWaLink(r)} target="_blank" rel="noreferrer" title="WhatsApp Reminder"><i className="fa-brands fa-whatsapp"></i></a>}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            </div>
          )}

          <div className="filters-section" style={{display:'flex', gap:'10px', alignItems:'flex-end', flexWrap:'wrap', marginBottom:'14px'}}>
            <div className="form-group" style={{margin:0, minWidth:'180px'}}><label><i className="fas fa-filter"></i> Status</label><SearchableDropdown options={statusOpts} value={fStatus} onChange={setFStatus} placeholder="All Statuses" /></div>
            {fStatus && <button className="btn btn-secondary" onClick={() => setFStatus('')}><i className="fas fa-times-circle"></i> Clear</button>}
          </div>

          {rows === undefined ? <TableSkeleton rows={6} columns={9} /> : <table id="installmentsTable" className="display" style={{width:'100%'}}></table>}
          {rows !== undefined && (shown || []).length > 0 && <div className="table-summary"><span><i className="fas fa-users"></i> Customers:<b>{(shown || []).length}</b></span><span><i className="fas fa-sack-dollar"></i> Financed:<b>{money(sumR.total)}</b></span><span><i className="fas fa-money-bill-wave"></i> Collected:<b>{money(sumR.paid)}</b></span><span><i className="fas fa-hand-holding-dollar"></i> Outstanding:<b>{money(sumR.rem)}</b></span></div>}

          {show && <CreateInstallmentPlanModal saleOpts={saleOpts} salesList={saleRes && saleRes.success ? saleRes.data : []} onClose={() => setShow(false)} onSave={createPlan} />}
          {openPlan && (
            <InstallmentPlanModal
              plan={openPlan}
              canPay={canPay}
              today={today}
              onPay={(t) => setPayRow(t)}
              onClose={() => setOpenKey(null)}
              userId={userId}
              onEditPayment={(p) => setEditPay(p)}
              onDeletePayment={deletePayment}
            />
          )}
          {payRow && <InstallmentPayModal row={payRow} onClose={() => setPayRow(null)} onSave={payInstallment} />}
          {editPay && (
            <InstallmentPayModal
              row={null}
              payment={editPay}
              onClose={() => setEditPay(null)}
              onSave={(amt, method, proof) => saveEditPayment(editPay.id, amt, method, proof)}
            />
          )}
        </div>
      );
    }
    function CreateInstallmentPlanModal({ saleOpts, salesList, onClose, onSave }) {
      const [saleId, setSaleId] = useState('');
      const [down, setDown] = useState('');
      const [n, setN] = useState(3);
      const [method, setMethod] = useState('cash');
      const [interestType, setInterestType] = useState('percent'); // 'percent' or 'flat'
      const [interestVal, setInterestVal] = useState('0');
      const methodOpts = [{ value:'cash', label:'Cash' }, { value:'card', label:'Card' }, { value:'bank_transfer', label:'Bank Transfer' }, { value:'gpay', label:'GPay' }, { value:'phonepe', label:'PhonePe' }];
      const interestTypeOpts = [{ value:'percent', label:'Interest Rate (%)' }, { value:'flat', label:'Flat Interest (' + (window.SHOP?.currency || '₹') + ')' }];

      const selectedSale = (salesList || []).find(s => s.id === Number(saleId));
      const currentDue = selectedSale ? Number(selectedSale.due_amount) || 0 : 0;
      const dp = Number(down) || 0;
      const principal = Math.max(0, currentDue - dp);
      const interestAmt = interestType === 'percent'
        ? round2(principal * (Number(interestVal) || 0) / 100)
        : (Number(interestVal) || 0);
      const totalInstallments = round2(principal + interestAmt);
      const numInst = parseInt(n) || 1;
      const monthlyAmt = round2(totalInstallments / numInst);

      const submit = (e) => {
        e.preventDefault();
        if (!saleId) { Swal.fire({ icon:'warning', title:'Select a sale' }); return; }
        const cnt = parseInt(n) || 0;
        if (cnt < 1) { Swal.fire({ icon:'warning', title:'Enter at least 1 installment' }); return; }
        if (dp > currentDue) { Swal.fire({ icon:'warning', title:'Down payment cannot exceed balance due' }); return; }
        onSave({
          sale_id: saleId,
          down_payment: dp,
          num_installments: cnt,
          method,
          interest_rate: interestType === 'percent' ? (Number(interestVal) || 0) : 0,
          interest_amount: interestAmt
        });
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'500px'}}>
            <div className="modal-header"><h3><i className="fas fa-hand-holding-dollar"></i> Create Installment Plan</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={submit}>
                <div className="form-group"><label><i className="fas fa-file-invoice"></i> Sale *</label><SearchableDropdown options={saleOpts} value={saleId} onChange={setSaleId} placeholder="Select a sale with a balance due" /></div>
                
                {selectedSale && (
                  <>
                    <div className="form-grid">
                      <div className="form-group"><label><i className="fas fa-money-bill"></i> Down Payment</label><input type="number" step="0.01" min="0" max={currentDue} value={down} onChange={(e) => setDown(e.target.value)} placeholder="0.00" /></div>
                      <div className="form-group"><label><i className="fas fa-wallet"></i> Down Payment Method</label><SearchableDropdown options={methodOpts} value={method} onChange={setMethod} placeholder="Method" /></div>
                    </div>
                    <div className="form-grid">
                      <div className="form-group"><label><i className="fas fa-percent"></i> Interest Type</label><SearchableDropdown options={interestTypeOpts} value={interestType} onChange={setInterestType} placeholder="Type" /></div>
                      <div className="form-group"><label><i className="fas fa-calculator"></i> Interest Value</label><input type="number" step="0.01" min="0" value={interestVal} onChange={(e) => setInterestVal(e.target.value)} /></div>
                    </div>
                    <div className="form-grid">
                      <div className="form-group"><label><i className="fas fa-list-ol"></i> No. of Installments *</label><input type="number" min="1" value={n} onChange={(e) => setN(e.target.value)} required /></div>
                      <div className="form-group"><label><i className="fas fa-calendar-days"></i> Frequency</label><input type="text" value="Monthly" disabled /></div>
                    </div>

                    <div className="emi-calculator-preview" style={{background:'rgba(255,255,255,0.03)', padding:'12px', borderRadius:'8px', marginTop:'12px', border:'1px solid rgba(255,255,255,0.05)'}}>
                      <h4 style={{margin:'0 0 8px 0', fontSize:'13px', color:'var(--navy-accent)', borderBottom:'1px solid rgba(255,255,255,0.05)', paddingBottom:'6px'}}><i className="fas fa-calculator"></i> Live EMI Calculation Preview</h4>
                      <div style={{display:'flex', flexDirection:'column', gap:'4px', fontSize:'12px'}}>
                        <div style={{display:'flex', justifyContent:'space-between'}}><span>Remaining Due:</span><b>{money(currentDue)}</b></div>
                        <div style={{display:'flex', justifyContent:'space-between'}}><span>Down Payment:</span><b style={{color:'#ef4444'}}>- {money(dp)}</b></div>
                        <div style={{display:'flex', justifyContent:'space-between'}}><span>Principal Amount:</span><b>{money(principal)}</b></div>
                        <div style={{display:'flex', justifyContent:'space-between'}}><span>Interest Added:</span><b style={{color:'var(--warning)'}}>+ {money(interestAmt)}</b></div>
                        <hr style={{border:'0', borderTop:'1px solid rgba(255,255,255,0.1)', margin:'6px 0'}} />
                        <div style={{display:'flex', justifyContent:'space-between', fontSize:'14px', fontWeight:600}}><span>Total Financed:</span><b style={{color:'#2e7d32'}}>{money(totalInstallments)}</b></div>

    function InstallmentPayModal({ row, payment, onClose, onSave }) {
      const due = payment ? round2(payment.amount) : round2(Number(row.amount) - Number(row.paid_amount || 0));
      const [amount, setAmount] = useState(payment ? String(payment.amount) : String(due));
      const [method, setMethod] = useState(payment ? payment.method : 'cash');
      const [proof, setProof] = useState(payment ? payment.proof_url || '' : '');
      const [uploading, setUploading] = useState(false);
      const methodOpts = [{ value:'cash', label:'Cash' }, { value:'card', label:'Card' }, { value:'bank_transfer', label:'Bank Transfer' }, { value:'gpay', label:'GPay' }, { value:'phonepe', label:'PhonePe' }, { value:'other', label:'Other Online' }];

      const handleProofUpload = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setUploading(true);
        try {
          const compressed = await compressImage(file, 450, 450, 0.7);
          setProof(compressed);
        } catch (err) {
          console.error("Proof compression failed:", err);
        } finally {
          setUploading(false);
        }
      };

      const submit = () => {
        const amt = parseFloat(amount) || 0;
        if (amt <= 0) { Swal.fire({ icon:'warning', title:'Enter a valid amount' }); return; }
        onSave(amt, method, proof);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'420px'}}>
            <div className="modal-header"><h3><i className="fas fa-money-bill-wave"></i> {payment ? 'Edit Payment' : ('Record Payment — ' + esc(row.invoice_no))}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <div className="form-group"><label><i className="fas fa-coins"></i> Amount (max {money(due)})</label><input type="number" step="0.01" min="0" max={due} value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
              <div className="form-group"><label><i className="fas fa-wallet"></i> Method / Source</label><SearchableDropdown options={methodOpts} value={method} onChange={setMethod} placeholder="Method" /></div>
              
              <div className="form-group" style={{marginTop:'12px'}}>
                <label><i className="fas fa-camera"></i> Upload Proof of Payment (Screenshot/Receipt)</label>
                <input type="file" className="file-input" accept="image/*" onChange={handleProofUpload} />
                {uploading && <small style={{color:'var(--navy-accent)', display:'block'}}>Compressing image...</small>}
                {proof && (
                  <div style={{marginTop:'8px', textAlign:'center'}}>
                    <img src={proof} alt="Proof preview" style={{maxWidth:'100%', maxHeight:'120px', borderRadius:'6px', border:'1px solid rgba(255,255,255,0.1)'}} />
                    <button type="button" className="btn btn-secondary btn-sm" onClick={() => setProof('')} style={{display:'block', margin:'4px auto 0', padding:'2px 8px', fontSize:'11px'}}><i className="fas fa-trash"></i> Remove Proof</button>
                  </div>
                )}
              </div>

              <div className="form-actions" style={{marginTop:'15px'}}><button type="button" className="btn btn-primary" onClick={submit} disabled={uploading}><i className="fas fa-check"></i> {payment ? 'Update' : 'Record'}</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
            </div>
          </div>
        </div>
      );
    }

    function Dashboard({ userId, user, email, role, profileImage, themeMode, permissions, canEditRbac, onThemeToggle, onSettingsUpdate, onLogout }) {
      const firstPage = can(permissions, 'dashboard', 'v') ? 'dashboard' : 'account';
      const [activeMenu, setActiveMenu] = useState(firstPage);
      const [collapsed, setCollapsed] = useState(() => {
        try { return localStorage.getItem('sidebarCollapsed') === '1'; } catch (e) { return false; }
      });
      const [showMobileSidebar, setShowMobileSidebar] = useState(false);

      useEffect(() => {
        try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
      }, [collapsed]);

      // Esc closes the top-most open modal (skips when a row menu is open — it handles its own Esc)
      useEffect(() => {
        const onEsc = (e) => {
          if (e.key !== 'Escape' || document.querySelector('.row-menu')) return;
          const overlays = document.querySelectorAll('.modal-overlay');
          if (!overlays.length) return;
          const top = overlays[overlays.length - 1], btn = top.querySelector('.close-btn');
          btn ? btn.click() : top.click();
        };
        window.addEventListener('keydown', onEsc);
        return () => window.removeEventListener('keydown', onEsc);
      }, []);

      const pageMeta = PAGE_META[activeMenu] || { label: 'Dashboard', icon: 'fa-tachometer-alt' };

      // live notification feed — shares the dashboard stats key (deduped)
      const { data: statsRes } = useSWR(can(permissions, 'dashboard', 'v') ? 'dash:stats' : null, () => gsRun('getDashboardStats', userId), { revalidateOnFocus:false, refreshInterval:120000 });
      const stats = statsRes && statsRes.success ? statsRes.data : null;
      const notifs = [];
      if (stats) {
        if (stats.lowStockCount > 0 && can(permissions, 'products', 'v')) notifs.push({ icon:'fa-triangle-exclamation', text:`${stats.lowStockCount} product${stats.lowStockCount > 1 ? 's' : ''} low on stock`, go:'products' });
        if (stats.repairsReady > 0 && can(permissions, 'repairs', 'v')) notifs.push({ icon:'fa-bell', text:`${stats.repairsReady} repair${stats.repairsReady > 1 ? 's' : ''} ready for pickup`, go:'repairs' });
        if (stats.outstandingRepairBalance > 0 && can(permissions, 'repairs', 'v')) notifs.push({ icon:'fa-money-bill-wave', text:`${money(stats.outstandingRepairBalance)} outstanding on repairs`, go:'repairs' });
      }

      return (
        <>
          <div className={`sidebar-overlay ${showMobileSidebar ? 'show' : ''}`} onClick={() => setShowMobileSidebar(false)}></div>

          <div className="app-container">
            <Sidebar

              role={role}
              user={user}
              profileImage={profileImage}
              themeMode={themeMode}
              onThemeToggle={onThemeToggle}
              onLogout={onLogout}
              collapsed={collapsed}
              setCollapsed={setCollapsed}
              showMobile={showMobileSidebar}
              setShowMobile={setShowMobileSidebar}
              perms={permissions}
              canEditRbac={canEditRbac}
            />
            <div className="main-content">
              <Navbar
                icon={pageMeta.icon}
                title={pageMeta.label}
                userName={user}
                role={role}
                profileImage={profileImage}
                notifs={notifs}
                onLogout={onLogout}
                setActiveMenu={setActiveMenu}
                toggleSidebar={() => { (window.innerWidth <= 768) ? setShowMobileSidebar(true) : setCollapsed(!collapsed); }}
              />
              <MainContent
                activeMenu={activeMenu}
                userId={userId}
                userName={user}
                email={email}
                role={role}
                perms={permissions}
                canEditRbac={canEditRbac}
                setActiveMenu={setActiveMenu}
                onSettingsUpdate={onSettingsUpdate}
                profileImage={profileImage}
              />

          </div>

          <BottomNavigation
            activeMenu={activeMenu}
            setActiveMenu={setActiveMenu}
            perms={permissions}

          />

        </>
      );

    // ============== Main App ==============
    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [currentEmail, setCurrentEmail] = useState(null);
      const [userRole, setUserRole] = useState(null);
      const [profileImage, setProfileImage] = useState('');
      const [themeMode, setThemeMode] = useState('light');
      const [customColors, setCustomColors] = useState('');
      const [permissions, setPermissions] = useState(null);
      const [canEditRbac, setCanEditRbac] = useState(false);
      const [currentUserId, setCurrentUserId] = useState(null);

      const SESSION_DURATION = 60 * 60 * 1000;

      const applyTheme = (mode) => {
        if (mode === 'dark') {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
      };

      const applyCustomColors = (colors) => {
        if (colors) {
          try {
            const colorObj = JSON.parse(colors);
            const root = document.documentElement;
            root.style.setProperty('--navy-primary', colorObj.primary);
            root.style.setProperty('--navy-accent', colorObj.accent);
            if (colorObj.text) {
              root.style.setProperty('--text-primary', colorObj.text);
            }
          } catch (e) {}
        }
      };

      useEffect(() => {
        applyTheme(themeMode);
        applyCustomColors(customColors);
      }, [themeMode, customColors]);

      useEffect(() => {
        const checkSession = () => {
          try {
            const session = localStorage.getItem('userSession');
            if (session) {
              const sessionData = JSON.parse(session);
              const currentTime = new Date().getTime();
              const sessionAge = currentTime - sessionData.loginTime;

              if (sessionAge < SESSION_DURATION) {
                setIsLoggedIn(true);
                setCurrentUserId(sessionData.userId);
                setCurrentUser(sessionData.username);
                setCurrentEmail(sessionData.email);
                setUserRole(sessionData.role);
                setProfileImage(sessionData.profileImage || '');
                setThemeMode(sessionData.themeMode || 'light');
                setCustomColors(sessionData.customColors || '');
                setPermissions(sessionData.permissions || null);
                setCanEditRbac(!!sessionData.canEditRbac);
                // refresh perms from server (may have changed since login)
                gsRun('getMyPermissions', sessionData.userId).then((r) => {
                  if (r && r.success) {
                    setPermissions(r.perms);
                    setCanEditRbac(!!r.canEdit);
                    try {
                      const s = JSON.parse(localStorage.getItem('userSession') || '{}');
                      s.permissions = r.perms; s.canEditRbac = !!r.canEdit;
                      localStorage.setItem('userSession', JSON.stringify(s));
                    } catch (e) {}
                  }
                }).catch(() => {});
              } else {
                localStorage.removeItem('userSession');
              }
            }
          } catch (error) {
            console.error('Session check error:', error);
            localStorage.removeItem('userSession');
          }
        };

        checkSession();

        const sessionCheckInterval = setInterval(() => {
          const session = localStorage.getItem('userSession');
          if (session) {
            const sessionData = JSON.parse(session);
            const currentTime = new Date().getTime();
            const sessionAge = currentTime - sessionData.loginTime;

            if (sessionAge >= SESSION_DURATION) {
              localStorage.removeItem('userSession');
              setIsLoggedIn(false);
              setCurrentUser(null);
              setCurrentEmail(null);
              setUserRole(null);
              Swal.fire({
                icon: 'warning',
                title: 'Session Expired',
                text: 'Your session has expired. Please login again.',
                confirmButtonColor: 'var(--navy-primary)'
              });
            }
          }
        }, 60000);

        return () => clearInterval(sessionCheckInterval);
      }, []);

      // load shop settings (currency/name) so money() formats correctly
      const [, _bump] = useState(0);
      useEffect(() => {
        gsRun('getShopSettings').then((r) => { if (r && r.success && r.data) { window.SHOP = buildShopGlobal(r.data); _bump((n) => n + 1); } }).catch(() => {});
      }, []);

      const handleLogin = (u, token) => {
        const sessionData = {
          userId: token, username: u.username, role: u.role, email: u.email,
          profileImage: u.profileImage || '',
          themeMode: u.themeMode || 'light',
          customColors: u.customColors || '',
          permissions: u.permissions || null,
          canEditRbac: !!u.canEditRbac,
          loginTime: new Date().getTime()
        };
        localStorage.setItem('userSession', JSON.stringify(sessionData));
        setIsLoggedIn(true);
        setCurrentUserId(token);
        setCurrentUser(u.username);
        setCurrentEmail(u.email);
        setUserRole(u.role);
        setProfileImage(u.profileImage || '');
        setThemeMode(u.themeMode || 'light');
        setCustomColors(u.customColors || '');
        setPermissions(u.permissions || null);
        setCanEditRbac(!!u.canEditRbac);
      };

      const handleThemeToggle = () => {
        const newTheme = themeMode === 'light' ? 'dark' : 'light';
        setThemeMode(newTheme);

        google.script.run
          .withSuccessHandler(() => {
            const session = JSON.parse(localStorage.getItem('userSession'));
            session.themeMode = newTheme;
            localStorage.setItem('userSession', JSON.stringify(session));
          })
          .updateUserSettings(currentUserId, { themeMode: newTheme });
      };

      const handleSettingsUpdate = () => {
        google.script.run
          .withSuccessHandler((result) => {
            if (result.success) {
              const settings = result.settings;
              setProfileImage(settings.profileImage);
              setThemeMode(settings.themeMode);
              setCustomColors(settings.customColors);

              const session = JSON.parse(localStorage.getItem('userSession'));
              session.profileImage = settings.profileImage;
              session.themeMode = settings.themeMode;
              session.customColors = settings.customColors;
              localStorage.setItem('userSession', JSON.stringify(session));
            }
          })
          .getUserSettings(currentUserId);
      };

      const handleLogout = () => {
        Swal.fire({
          icon: 'question',
          title: 'Logout?',
          text: 'Are you sure you want to logout?',
          showCancelButton: true,
          confirmButtonColor: 'var(--navy-primary)',
          confirmButtonText: 'Yes, Logout'
        }).then((result) => {
          if (result.isConfirmed) {
            gsRun('logout', currentUserId).catch(() => {});
            localStorage.removeItem('userSession');
            setIsLoggedIn(false);
            setCurrentUserId(null);
            setCurrentUser(null);
            setCurrentEmail(null);
            setUserRole(null);
            setProfileImage('');
            setThemeMode('light');
            setCustomColors('');
            setPermissions(null);
            setCanEditRbac(false);
            document.body.classList.remove('dark-mode');

            Swal.fire({
              icon: 'success',
              title: 'Logged Out',
              text: 'You have been logged out successfully.',
              timer: 1500,
              showConfirmButton: false
            });
          }
        });
      };

      // public tracker link — bypasses login entirely, anonymous customer view
      if (TRACK_ID && TRACK_TOKEN) return <TrackStatusView id={TRACK_ID} token={TRACK_TOKEN} />;

      return (
        <div>
          <PopupHost />
          <GlobalLoadingBar />
          {!isLoggedIn ? (
            <LoginPage onLogin={handleLogin} />
          ) : (
            <Dashboard
              userId={currentUserId}
              user={currentUser}
              email={currentEmail}
              role={userRole}
              profileImage={profileImage}
              themeMode={themeMode}
              permissions={permissions}
              canEditRbac={canEditRbac}
              onThemeToggle={handleThemeToggle}
              onSettingsUpdate={handleSettingsUpdate}
              onLogout={handleLogout}
            />
          )}
        </div>
      );
    }

    // ============== Render App ==============
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
