    function CreateSupplierPurchaseModal({ supplierOpts, onClose, onSave }) {
      const [supplierId, setSupplierId] = useState('');
      const [invoiceNo, setInvoiceNo] = useState('');
      const [billDate, setBillDate] = useState(todayStr());
      const [items, setItems] = useState('');
      const [total, setTotal] = useState('');
      const [paid, setPaid] = useState('');
      const [method, setMethod] = useState('cash');
      const [proof, setProof] = useState('');
      const [uploading, setUploading] = useState(false);
      const methodOpts = [{ value:'cash', label:'Cash' }, { value:'card', label:'Card' }, { value:'bank_transfer', label:'Bank Transfer' }, { value:'gpay', label:'GPay' }, { value:'phonepe', label:'PhonePe' }, { value:'other', label:'Other Online' }];

      const handleProofUpload = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setUploading(true);
        try {
          const compressed = await compressImage(file, 450, 450, 0.7);
          setProof(compressed);
        } catch (err) {
          console.error("Proof compression failed:", err);
        } finally {
          setUploading(false);
        }
      };

      const submit = (e) => {
        e.preventDefault();
        if (!supplierId) { Swal.fire({ icon:'warning', title:'Select Supplier' }); return; }
        const t = parseFloat(total) || 0;
        const p = parseFloat(paid) || 0;
        if (t <= 0) { Swal.fire({ icon:'warning', title:'Enter a valid total amount' }); return; }
        if (p > t) { Swal.fire({ icon:'warning', title:'Paid amount cannot exceed total' }); return; }

        onSave({
          supplier_id: supplierId,
          invoice_no: invoiceNo,
          bill_date: billDate,
          items_summary: items,
          total_amount: t,
          amount_paid: p,
          method,
          bill_proof_url: proof
        });
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'500px'}}>
            <div className="modal-header"><h3><i className="fas fa-file-invoice-dollar"></i> New Supplier Purchase Bill</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={submit}>
                <div className="form-group"><label><i className="fas fa-truck-field"></i> Supplier *</label><SearchableDropdown options={supplierOpts} value={supplierId} onChange={setSupplierId} placeholder="Select Supplier" /></div>
                <div className="form-grid">
                  <div className="form-group"><label><i className="fas fa-file-invoice"></i> Bill / Invoice No.</label><input type="text" value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} placeholder="e.g. INV-1002" /></div>
                  <div className="form-group"><label><i className="fas fa-calendar-day"></i> Bill Date</label><input type="date" value={billDate} onChange={(e) => setBillDate(e.target.value)} /></div>
                </div>
                <div className="form-group"><label><i className="fas fa-list"></i> Items Bought (Summary) *</label><textarea value={items} onChange={(e) => setItems(e.target.value)} placeholder="What did you buy? e.g. 5x iPhone 13, 20x Screen Protectors" required style={{width:'100%', minHeight:'60px', padding:'8px', borderRadius:'4px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.1)', color:'#fff', resize:'vertical'}}></textarea></div>
                
                <div className="form-grid">
                  <div className="form-group"><label><i className="fas fa-sack-dollar"></i> Total Bill Amount *</label><input type="number" step="0.01" min="0.01" value={total} onChange={(e) => setTotal(e.target.value)} required /></div>
                  <div className="form-group"><label><i className="fas fa-money-bill-wave"></i> Amount Paid Initially</label><input type="number" step="0.01" min="0" value={paid} onChange={(e) => setPaid(e.target.value)} /></div>
                </div>

                {parseFloat(paid) > 0 && (
                  <div className="form-group"><label><i className="fas fa-wallet"></i> Payment Method</label><SearchableDropdown options={methodOpts} value={method} onChange={setMethod} placeholder="Method" /></div>
                )}

                <div className="form-group" style={{marginTop:'12px'}}>
                  <label><i className="fas fa-camera"></i> Upload Bill / Invoice Proof (Screenshot/Receipt)</label>
                  <input type="file" className="file-input" accept="image/*" onChange={handleProofUpload} />
                  {uploading && <small style={{color:'var(--navy-accent)', display:'block'}}>Compressing bill...</small>}
                  {proof && (
                    <div style={{marginTop:'8px', textAlign:'center'}}>
                      <img src={proof} alt="Bill proof preview" style={{maxWidth:'100%', maxHeight:'120px', borderRadius:'6px', border:'1px solid rgba(255,255,255,0.1)'}} />
                      <button type="button" className="btn btn-secondary btn-sm" onClick={() => setProof('')} style={{display:'block', margin:'4px auto 0', padding:'2px 8px', fontSize:'11px'}}><i className="fas fa-trash"></i> Remove Bill</button>
                    </div>
                  )}
                </div>

                <div className="form-actions" style={{marginTop:'15px'}}><button type="submit" className="btn btn-primary" disabled={uploading}><i className="fas fa-save"></i> Save Bill</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function SupplierPayModal({ purchase, payment, onClose, onSave }) {
      const due = purchase ? round2(Number(purchase.due_amount)) : 0;
      const [amount, setAmount] = useState(payment ? String(payment.amount) : String(due));
      const [method, setMethod] = useState(payment ? payment.method : 'cash');
      const [proof, setProof] = useState(payment ? payment.proof_url || '' : '');
      const [uploading, setUploading] = useState(false);
      const methodOpts = [{ value:'cash', label:'Cash' }, { value:'card', label:'Card' }, { value:'bank_transfer', label:'Bank Transfer' }, { value:'gpay', label:'GPay' }, { value:'phonepe', label:'PhonePe' }, { value:'other', label:'Other Online' }];

      const handleProofUpload = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setUploading(true);
        try {
          const compressed = await compressImage(file, 450, 450, 0.7);
          setProof(compressed);
        } catch (err) {
          console.error("Proof compression failed:", err);
        } finally {
          setUploading(false);
        }
      };

      const submit = () => {
        const amt = parseFloat(amount) || 0;
        if (amt <= 0) { Swal.fire({ icon:'warning', title:'Enter a valid amount' }); return; }
        if (purchase && amt > due) { Swal.fire({ icon:'warning', title:'Amount cannot exceed remaining dues' }); return; }
        onSave(amt, method, proof);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'420px'}}>
            <div className="modal-header"><h3><i className="fas fa-money-bill-wave"></i> {payment ? 'Edit Payment' : 'Record Supplier Payment'}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <div className="form-group"><label><i className="fas fa-coins"></i> Amount {purchase && `(max ${money(due)})`}</label><input type="number" step="0.01" min="0" max={purchase ? due : undefined} value={amount} onChange={(e) => setAmount(e.target.value)} /></div>
              <div className="form-group"><label><i className="fas fa-wallet"></i> Method / Source</label><SearchableDropdown options={methodOpts} value={method} onChange={setMethod} placeholder="Method" /></div>
              
              <div className="form-group" style={{marginTop:'12px'}}>
                <label><i className="fas fa-camera"></i> Upload Proof of Payment (Screenshot/Receipt)</label>
                <input type="file" className="file-input" accept="image/*" onChange={handleProofUpload} />
                {uploading && <small style={{color:'var(--navy-accent)', display:'block'}}>Compressing proof...</small>}
                {proof && (
                  <div style={{marginTop:'8px', textAlign:'center'}}>
                    <img src={proof} alt="Proof preview" style={{maxWidth:'100%', maxHeight:'120px', borderRadius:'6px', border:'1px solid rgba(255,255,255,0.1)'}} />
                    <button type="button" className="btn btn-secondary btn-sm" onClick={() => setProof('')} style={{display:'block', margin:'4px auto 0', padding:'2px 8px', fontSize:'11px'}}><i className="fas fa-trash"></i> Remove Proof</button>
                  </div>
                )}
              </div>

              <div className="form-actions" style={{marginTop:'15px'}}><button type="button" className="btn btn-primary" onClick={submit} disabled={uploading}><i className="fas fa-check"></i> {payment ? 'Update' : 'Record'}</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
            </div>
          </div>
        </div>
      );
    }

    function SupplierPaymentsModal({ purchase, onClose, userId, onEditPayment, onDeletePayment }) {
      const { data: payRes, mutate: mutatePays } = useSWR(purchase ? `supplier_payments:pur:${purchase.id}` : null, () => gsRun('getSupplierPayments', purchase.id));
      const payments = payRes && payRes.success ? payRes.data : [];

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'640px'}}>
            <div className="modal-header"><h3><i className="fas fa-history"></i> Supplier Payments Ledger — {esc(purchase.supplier_name)}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <div className="ins-plan-head" style={{marginBottom:'10px'}}>
                <div><span className="ins-k">Bill Invoice</span><span className="ins-v">{esc(purchase.invoice_no || '—')}</span></div>
                <div><span className="ins-k">Dues Status</span><span dangerouslySetInnerHTML={{__html: statusPill(purchase.payment_status)}}></span></div>
              </div>
              <div className="ins-summary" style={{gridTemplateColumns:'repeat(3, 1fr)', gap:'8px', marginBottom:'14px'}}>
                <div className="ins-card"><span>Total Bill</span><b>{money(purchase.total_amount)}</b></div>
                <div className="ins-card"><span>Paid</span><b style={{color:'#2e7d32'}}>{money(purchase.amount_paid)}</b></div>
                <div className="ins-card"><span>Remaining Dues</span><b style={{color:'#c5221f'}}>{money(purchase.due_amount)}</b></div>
              </div>
              
              <div className="about-table-wrapper">
                <table className="about-roles-table">
                  <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Proof</th><th>Actions</th></tr></thead>
                  <tbody>
                    {payments.length === 0 && <tr><td colSpan="5" style={{textAlign:'center', color:'#778'}}>No payments recorded yet.</td></tr>}
                    {payments.map(p => (

                        <td>{money(p.amount)}</td>

                        <td>
                          {p.proof_url ? (
                            <button className="btn btn-secondary btn-sm" style={{padding:'2px 8px', fontSize:'11px'}} onClick={() => {
                              Swal.fire({
                                title: 'Payment Proof',
                                imageUrl: p.proof_url,
                                imageAlt: 'Proof of payment',
                                confirmButtonText: 'Close',
                                confirmButtonColor: 'var(--navy-primary)'
                              });
                            }}><i className="fas fa-image"></i> View Proof</button>
                          ) : <span style={{color:'#778'}}>—</span>}
                        </td>
                        <td>
                          <div style={{display:'flex', gap:'6px'}}>
                            <button className="action-icon" style={{color:'var(--navy-accent)'}} title="Edit Payment" onClick={() => onEditPayment(p)}><i className="fas fa-edit"></i></button>
                            <button className="action-icon" style={{color:'#b91c1c'}} title="Delete Payment" onClick={() => onDeletePayment(p.id)}><i className="fas fa-trash"></i></button>
                          </div>

                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============== Products ==============
    function ProductsView({ userId, role, perms }) {
      const canAdd = can(perms, 'products', 'a'), canEdit = can(perms, 'products', 'e'), canDel = can(perms, 'products', 'd'), canAdjust = can(perms, 'inventory', 'a');
      const { data: res, mutate } = useSWR('products:all', () => gsRun('getProducts', userId), { revalidateOnFocus:false });
      const { data: supRes } = useSWR('suppliers:all', () => gsRun('getSuppliers', userId), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const supplierOpts = (supRes && supRes.success ? supRes.data : []).map(s => ({ value:s.id, label:s.name }));
      const [show, setShow] = useState(false);
      const [editing, setEditing] = useState(null);
      const [galleryProduct, setGalleryProduct] = useState(null);
      const [viewId, setViewId] = useState(null);
      const [busy, setBusy] = useState('');

      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Access', text:res.message }); }, [res]);

      const catChip = (c) => '<span class="chip chip-' + String(c || '').replace(/[^a-z_]/gi, '') + '">' + esc(c) + '</span>';
      const thumbCell = (d, n) => (d ? `<img src="${esc(d)}" class="dt-thumb" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="dt-thumb ph"><i class="fas fa-image"></i></span>') + (n > 1 ? `<span class="dt-thumb-badge">${n}</span>` : '');
      const cols = [
        { data:'id', title:'ID' },
        { data:'image_url', title:'', orderable:false, render:(d, t, row) => thumbCell(d, (row.images && row.images.length) || (d ? 1 : 0)) },
        { data:'name', title:'Name', render:(d) => esc(d) },
        { data:'sku', title:'SKU', render:(d) => esc(d) || '—' },
        { data:'brand', title:'Brand', render:(d) => esc(d) || '—' },
        { data:'model', title:'Model', render:(d) => esc(d) || '—' },
        { data:'category', title:'Category', render:(c) => catChip(c) },
        { data:'barcode', title:'Barcode', render:(d) => esc(d) || '—' },
        { data:'supplier_name', title:'Supplier', render:(d) => esc(d) },
        { data:'purchase_price', title:'Purchase', render:(v) => money(v) },
        { data:'sale_price', title:'Sale', render:(v) => money(v) },
        { data:null, title:'Stock Val', orderable:false, render:(x, t, row) => money(Number(row.stock_qty || 0) * Number(row.purchase_price || 0)) },
        { data:null, title:'Margin', orderable:false, render:(x, t, row) => { const sp = Number(row.sale_price) || 0; return sp > 0 ? Math.round((sp - Number(row.purchase_price || 0)) / sp * 100) + '%' : '—'; } },
        { data:'vat_rate', title:'VAT', render:(v) => v + '%' },
        { data:'stock_qty', title:'Stock', render:(q, t, row) => row.low ? `<span style="color:#c5221f;font-weight:700">${q} ⚠</span>` : q },
        { data:'status', title:'Status', render:(d) => statusPill(d || 'active') },
        { data:null, title:'Actions', orderable:false, render:() =>
          ('<button class="action-icon" data-action="view" title="View"><i class="fas fa-eye"></i></button>' +
           (canAdjust ? '<button class="action-icon" data-action="adjust" title="Adjust Stock"><i class="fas fa-arrows-up-down"></i></button>' : '') +
           '<button class="action-icon" data-action="more" title="More"><i class="fas fa-ellipsis-vertical"></i></button>') }
      ];
      const doDelete = (row) => Swal.fire({ icon:'warning', title:'Delete product?', text:row.name, showCancelButton:true, confirmButtonColor:'var(--danger)', confirmButtonText:'Delete' }).then(r => { if (r.isConfirmed) { setBusy('Deleting…'); gsRun('deleteProduct', row.id, userId).then(rr => { setBusy(''); if (rr.success) { Swal.fire({ icon:'success', title:'Deleted', timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:rr.message }); }); } });
      const doAdjust = (row) => Swal.fire({
        title:'Adjust Stock',
        html:`<div style="text-align:left;font-size:13px;color:#555;margin-bottom:8px">${esc(row.name)} — current: <b>${row.stock_qty}</b></div><input id="adjQty" type="number" class="swal2-input" placeholder="Qty change (e.g. 5 or -2)"><input id="adjNote" type="text" class="swal2-input" placeholder="Note (optional)">`,
        showCancelButton:true, confirmButtonText:'Apply', confirmButtonColor:'var(--navy-primary)',
        preConfirm:() => { const qty = Number(document.getElementById('adjQty').value); const note = document.getElementById('adjNote').value; if (!qty) { Swal.showValidationMessage('Enter a non-zero qty change'); return false; } return { qty, note }; }
      }).then(r => { if (r.isConfirmed && r.value) { setBusy('Adjusting…'); gsRun('adjustStock', row.id, Number(r.value.qty), r.value.note, userId).then(rr => { setBusy(''); if (rr.success) { Swal.fire({ icon:'success', title:'Stock adjusted', timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:rr.message }); }); } });
      const onAction = (action, row, e) => {
        if (action === 'view') { setViewId(row.id); }
        else if (action === 'adjust') { doAdjust(row); }
        else if (action === 'more') {
          rowMenu(e, [
            { label:'Open', items:[{ icon:'fa-eye', label:'View', onClick:() => setViewId(row.id) }, ((row.images && row.images.length) || row.image_url) ? { icon:'fa-images', label:'Images', onClick:() => setGalleryProduct(row) } : null].filter(Boolean) },
            { label:'Manage', items:[canEdit ? { icon:'fa-edit', label:'Edit', onClick:() => { setEditing(row); setShow(true); } } : null, canAdjust ? { icon:'fa-arrows-up-down', label:'Adjust Stock', onClick:() => doAdjust(row) } : null, canDel ? { icon:'fa-trash', label:'Delete', danger:true, onClick:() => doDelete(row) } : null].filter(Boolean) }
          ]);
        }
      };
      const tpl = () => downloadCsv('products_template.csv', 'supplier_id,name,sku,category,barcode,brand,model,purchase_price,sale_price,mrp,vat_rate,stock_qty,low_stock_alert,status\n1,Product 1,SKU-001,accessory,BC-0001,Brand 1,Model 1,5,9.99,12,21,10,5,active\n');
      useDataTable('productsTable', rows, cols, { onAction, onRefresh:() => mutate(), canImport:canAdd, importId:'productsCsvImport', template:tpl, dt:{ createdRow:(tr, row) => { if (row.low) tr.classList.add('row-warn'); } } });
      const stockValue = (rows || []).reduce((a, p) => a + Number(p.stock_qty || 0) * Number(p.purchase_price || 0), 0);
      const lowCount = (rows || []).filter(p => p.low).length;

      const save = (form) => {
        setBusy(editing ? 'Updating…' : 'Saving…');
        const p = editing ? gsRun('updateProduct', editing.id, form, userId) : gsRun('addProduct', form, userId);
        p.then(r => { setBusy(''); if (r.success) { setShow(false); setEditing(null); Swal.fire({ icon:'success', title:r.message, timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:r.message }); });
      };

      return (
        <div className="data-section">
          <LoadingPopup text={busy} />
          <div className="section-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px', flexWrap:'wrap', gap:'10px'}}>
            <h2 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', margin:0}}><i className="fas fa-box"></i> Products</h2>
            {canAdd && <button className="btn btn-primary" onClick={() => { setEditing(null); setShow(true); }}><i className="fas fa-plus"></i> Add Product</button>}
          </div>
          {canAdd && <input type="file" id="productsCsvImport" accept=".csv" style={{display:'none'}} onChange={(e) => csvImport(e, 'bulkImportProducts', userId, 'products', mutate)} />}
          {rows === undefined ? <TableSkeleton rows={6} columns={10} /> : <table id="productsTable" className="display" style={{width:'100%'}}></table>}
          {rows !== undefined && rows.length > 0 && <div className="table-summary"><span><i className="fas fa-box"></i> Products:<b>{rows.length}</b></span><span><i className="fas fa-warehouse"></i> Stock value:<b>{money(stockValue)}</b></span><span><i className="fas fa-triangle-exclamation"></i> Low stock:<b>{lowCount}</b></span></div>}
          {show && <ProductModal product={editing} supplierOpts={supplierOpts} userId={userId} onClose={() => { setShow(false); setEditing(null); }} onSave={save} />}
          {galleryProduct && <ProductGallery product={galleryProduct} onClose={() => setGalleryProduct(null)} />}
          {viewId && <ProductView productId={viewId} userId={userId} onClose={() => setViewId(null)} />}
        </div>
      );
    }
    function ProductView({ productId, userId, onClose }) {
      const { data } = useSWR('pdetail:' + productId, () => gsRun('getProductDetail', productId, userId), { revalidateOnFocus:false });
      const D = data && data.success ? data.data : null;
      if (!D) return <ViewModal title="Product" icon="fa-box" onClose={onClose} tabs={[{ key:'l', label:'Loading', content:<TableSkeleton rows={4} columns={4} /> }]} />;
      const p = D.product;
      const margin = Number(p.sale_price) > 0 ? Math.round((Number(p.sale_price) - Number(p.purchase_price)) / Number(p.sale_price) * 100) : 0;
      const imgs = (p.images && p.images.length) ? p.images : (p.image_url ? [p.image_url] : []);
      const details = (
        <div>
          {imgs.length > 0 && <div className="gallery-grid" style={{marginBottom:'14px'}}>{imgs.map((s, i) => <img key={i} src={s} alt="" onError={(e) => { e.target.onerror = null; e.target.src = LOGO_URL; }} />)}</div>}
          <VmKpis items={[
            { k:'Stock', v:p.stock_qty, color: Number(p.stock_qty) <= Number(p.low_stock_alert || 0) ? '#b91c1c' : undefined },
            { k:'Stock Value', v:money(Number(p.stock_qty) * Number(p.purchase_price)) },
            { k:'Margin', v:margin + '%' },
            { k:'Sold (all-time)', v:D.soldQty }
          ]} />
          <VmFields rows={[['SKU', p.sku], ['Barcode', p.barcode], ['Brand', p.brand], ['Model', p.model], ['Category', p.category], ['Supplier', p.supplier_name], ['Purchase', money(p.purchase_price)], ['Sale', money(p.sale_price)], ['MRP', Number(p.mrp) ? money(p.mrp) : ''], ['VAT', p.vat_rate + '%'], ['Low-stock alert', p.low_stock_alert], ['Warranty', p.warranty_months ? p.warranty_months + ' months' : ''], ['Status', p.status], ['Description', p.description]]} />
        </div>
      );
      const moveTab = D.moves.length ? <div className="about-table-wrapper"><table className="about-roles-table"><thead><tr><th>Date</th><th>Type</th><th>Qty</th><th>Note</th><th>By</th></tr></thead>
        <tbody>{D.moves.map((m, i) => <tr key={i}><td>{fmtDate(m.created)}</td><td>{esc((m.movement_type || '').replace('_', ' '))}</td><td style={{color: Number(m.qty_change) >= 0 ? '#2e7d32' : '#c5221f', fontWeight:600}}>{Number(m.qty_change) > 0 ? '+' : ''}{m.qty_change}</td><td>{esc(m.note) || '—'}</td><td>{esc(m.user_name)}</td></tr>)}</tbody></table></div> : <VmEmpty text="No stock movements." />;
      const soldTab = D.sold.length ? <div className="about-table-wrapper"><table className="about-roles-table"><thead><tr><th>Invoice</th><th>Date</th><th>Qty</th><th>Unit Price</th></tr></thead>
        <tbody>{D.sold.map((x, i) => <tr key={i}><td>{esc(x.invoice_no)}</td><td>{fmtDay(x.created)}</td><td>{x.qty}</td><td>{money(x.unit_price, x)}</td></tr>)}</tbody></table></div> : <VmEmpty text="Not sold yet." />;
      return <ViewModal title={p.name} icon="fa-box" width="820px" onClose={onClose} tabs={[
        { key:'details', label:'Details', icon:'fa-circle-info', content:details },
        { key:'stock', label:'Stock Movement', icon:'fa-warehouse', badge:D.moves.length, content:moveTab },
        { key:'sales', label:'Sales History', icon:'fa-cart-shopping', badge:D.sold.length, content:soldTab }
      ]} />;
    }

    function ProductGallery({ product, onClose }) {
      const imgs = (product.images && product.images.length) ? product.images : (product.image_url ? [product.image_url] : []);
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'680px'}}>
            <div className="modal-header"><h3><i className="fas fa-images"></i> {product.name} — {imgs.length} image{imgs.length === 1 ? '' : 's'}</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              {!imgs.length ? <p style={{color:'#888'}}>No images.</p> : (
                <div className="gallery-grid">{imgs.map((src, i) => <a key={i} href={src} target="_blank" rel="noreferrer"><img src={src} alt="" onError={(e) => { e.target.onerror = null; e.target.src = LOGO_URL; }} /></a>)}</div>
              )}
            </div>
          </div>
        </div>
      );
    }
    function ProductModal({ product, supplierOpts, userId, onClose, onSave }) {
      const isEdit = !!product;
      const [f, setF] = useState({
        supplier_id: product?.supplier_id || '',
        name: product?.name || '',
        sku: product?.sku || '',
        category: product?.category || 'phone',
        barcode: product?.barcode || '',
        brand: product?.brand || '',
        model: product?.model || '',
        color: product?.color || '',
        storage: product?.storage || '',
        ram: product?.ram || '',
        condition: product?.condition || 'new',
        purchase_price: product?.purchase_price ?? '',
        sale_price: product?.sale_price ?? '',
        mrp: product?.mrp ?? '',
        vat_rate: product?.vat_rate ?? 21,
        tax_inclusive: product?.tax_inclusive ? '1' : '0',
        discount_max: product?.discount_max ?? '',
        low_stock_alert: product?.low_stock_alert ?? 5,
        reorder_qty: product?.reorder_qty ?? '',
        unit: product?.unit || 'pcs',
        shelf_location: product?.shelf_location || '',
        supplier_sku: product?.supplier_sku || '',
        weight: product?.weight || '',
        warranty_months: product?.warranty_months ?? 0,
        description: product?.description || '',
        status: product?.status || 'active',
        image_url: product?.image_url || '',
        stock_qty: product?.stock_qty ?? 0
      });
      const catOpts = [{ value:'phone', label:'phone' }, { value:'accessory', label:'accessory' }, { value:'repair_part', label:'repair_part' }];
      const condOpts = [{ value:'new', label:'New' }, { value:'refurbished', label:'Refurbished' }, { value:'used', label:'Used' }];
      const unitOpts = [{ value:'pcs', label:'Piece' }, { value:'box', label:'Box' }, { value:'pack', label:'Pack' }, { value:'pair', label:'Pair' }];
      const taxIncOpts = [{ value:'0', label:'Tax exclusive' }, { value:'1', label:'Tax inclusive' }];
      const statusOpts = [{ value:'active', label:'Active' }, { value:'discontinued', label:'Discontinued' }];
      const set = (k, v) => setF({ ...f, [k]: v });

      // multi-image manager (first = primary → image_url)
      const [images, setImages] = useState(product?.images && product.images.length ? product.images.slice() : (product?.image_url ? [product.image_url] : []));
      const [imgUrl, setImgUrl] = useState('');
      const [uploading, setUploading] = useState(false);
      const addUrl = () => { const u = imgUrl.trim(); if (u) { setImages(a => [...a, u]); setImgUrl(''); } };
      const removeImg = (i) => setImages(a => a.filter((_, j) => j !== i));
      const makePrimary = (i) => setImages(a => { const c = a.slice(); const [x] = c.splice(i, 1); return [x, ...c]; });
      const pickImgs = async (e) => {
        const files = Array.from(e.target.files || []); if (!files.length) return;
        setUploading(true);
        for (const file of files) {
          const b64 = await compressImage(file, 500, 500, 0.7);
          const r = await gsRun('uploadProductImage', b64, file.name, userId);
          if (r && r.success) setImages(a => [...a, r.fileUrl]); else Swal.fire({ icon:'error', title:'Upload failed', text:(r && r.message) || file.name });
        }
        setUploading(false); e.target.value = '';
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header"><h3><i className="fas fa-box"></i> {isEdit ? 'Edit' : 'Add'} Product</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={(e) => {
                e.preventDefault();
                if (!f.supplier_id) { Swal.fire({ icon:'warning', title:'Supplier required' }); return; }
                if (!f.name.trim()) { Swal.fire({ icon:'warning', title:'Name required' }); return; }
                const out = { ...f, tax_inclusive: f.tax_inclusive === '1' ? 1 : 0, images: images, image_url: images[0] || '' };
                if (isEdit) delete out.stock_qty;
                onSave(out);
              }}>
                <div className="form-grid">
                  <div className="form-group"><label><i className="fas fa-truck-field"></i> Supplier *</label><SearchableDropdown options={supplierOpts} value={f.supplier_id} onChange={(v) => set('supplier_id', v)} placeholder="Select supplier" /></div>
                  <div className="form-group"><label><i className="fas fa-tag"></i> Name *</label><input type="text" value={f.name} onChange={(e) => set('name', e.target.value)} required /></div>
                  <div className="form-group"><label><i className="fas fa-hashtag"></i> SKU</label><input type="text" value={f.sku} onChange={(e) => set('sku', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-layer-group"></i> Category</label><SearchableDropdown options={catOpts} value={f.category} onChange={(v) => set('category', v)} placeholder="Category" /></div>
                  <div className="form-group"><label><i className="fas fa-barcode"></i> Barcode</label><input type="text" value={f.barcode} onChange={(e) => set('barcode', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-copyright"></i> Brand</label><input type="text" value={f.brand} onChange={(e) => set('brand', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-mobile-screen"></i> Model</label><input type="text" value={f.model} onChange={(e) => set('model', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-palette"></i> Color</label><input type="text" value={f.color} onChange={(e) => set('color', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-database"></i> Storage</label><input type="text" value={f.storage} onChange={(e) => set('storage', e.target.value)} placeholder="128GB" /></div>
                  <div className="form-group"><label><i className="fas fa-memory"></i> RAM</label><input type="text" value={f.ram} onChange={(e) => set('ram', e.target.value)} placeholder="8GB" /></div>
                  <div className="form-group"><label><i className="fas fa-certificate"></i> Condition</label><SearchableDropdown options={condOpts} value={f.condition} onChange={(v) => set('condition', v)} placeholder="Condition" /></div>
                  <div className="form-group"><label><i className="fas fa-money-bill"></i> Purchase Price</label><input type="number" step="0.01" value={f.purchase_price} onChange={(e) => set('purchase_price', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-tags"></i> Sale Price</label><input type="number" step="0.01" value={f.sale_price} onChange={(e) => set('sale_price', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-tag"></i> MRP / List</label><input type="number" step="0.01" value={f.mrp} onChange={(e) => set('mrp', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-percent"></i> VAT Rate</label><input type="number" step="0.01" value={f.vat_rate} onChange={(e) => set('vat_rate', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-receipt"></i> Tax Mode</label><SearchableDropdown options={taxIncOpts} value={f.tax_inclusive} onChange={(v) => set('tax_inclusive', v)} placeholder="Tax mode" /></div>
                  <div className="form-group"><label><i className="fas fa-tag"></i> Max Discount %</label><input type="number" step="0.01" value={f.discount_max} onChange={(e) => set('discount_max', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-triangle-exclamation"></i> Low Stock Alert</label><input type="number" value={f.low_stock_alert} onChange={(e) => set('low_stock_alert', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-rotate"></i> Reorder Qty</label><input type="number" value={f.reorder_qty} onChange={(e) => set('reorder_qty', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-ruler"></i> Unit</label><SearchableDropdown options={unitOpts} value={f.unit} onChange={(v) => set('unit', v)} placeholder="Unit" /></div>
                  <div className="form-group"><label><i className="fas fa-map-pin"></i> Shelf / Location</label><input type="text" value={f.shelf_location} onChange={(e) => set('shelf_location', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-barcode"></i> Supplier SKU</label><input type="text" value={f.supplier_sku} onChange={(e) => set('supplier_sku', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-weight-hanging"></i> Weight</label><input type="text" value={f.weight} onChange={(e) => set('weight', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-shield-halved"></i> Warranty (months)</label><input type="number" value={f.warranty_months} onChange={(e) => set('warranty_months', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-toggle-on"></i> Status</label><SearchableDropdown options={statusOpts} value={f.status} onChange={(v) => set('status', v)} placeholder="Status" /></div>
                  {!isEdit && <div className="form-group"><label><i className="fas fa-boxes-stacked"></i> Opening Stock</label><input type="number" value={f.stock_qty} onChange={(e) => set('stock_qty', e.target.value)} /></div>}
                  <div className="form-group" style={{gridColumn:'1 / -1'}}>
                    <label><i className="fas fa-images"></i> Product Images {images.length > 0 && <span style={{color:'#789', fontWeight:400}}>({images.length} · first = primary)</span>}</label>
                    <div style={{display:'flex', gap:'8px', flexWrap:'wrap'}}>
                      <input type="text" value={imgUrl} onChange={(e) => setImgUrl(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addUrl(); } }} placeholder="Paste an image URL…" style={{flex:'1 1 220px'}} />
                      <button type="button" className="btn btn-secondary" onClick={addUrl}><i className="fas fa-link"></i> Add URL</button>
                    </div>
                    <div className="img-manager">
                      {images.map((src, i) => (
                        <div key={i} className={'img-tile' + (i === 0 ? ' primary' : '')}>
                          <img src={src} alt="" onError={(e) => { e.target.onerror = null; e.target.src = LOGO_URL; }} />
                          <button type="button" className="img-x" title="Remove" onClick={() => removeImg(i)}><i className="fas fa-times"></i></button>
                          {i !== 0 && <button type="button" className="img-star" title="Make primary" onClick={() => makePrimary(i)}><i className="fas fa-star"></i></button>}
                          {i === 0 && <span className="img-badge">PRIMARY</span>}
                        </div>
                      ))}
                      <label className="img-add">
                        {uploading ? <span><i className="fas fa-spinner fa-spin"></i> Uploading</span> : <span><i className="fas fa-plus"></i> Upload</span>}
                        <input type="file" accept="image/*" multiple style={{display:'none'}} onChange={pickImgs} />
                      </label>
                    </div>
                  </div>
                  <div className="form-group" style={{gridColumn:'1 / -1'}}><label><i className="fas fa-align-left"></i> Description</label><textarea rows="2" value={f.description} onChange={(e) => set('description', e.target.value)}></textarea></div>
                </div>
                <div className="form-actions"><button type="submit" className="btn btn-primary"><i className="fas fa-save"></i> Save</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============== Users / Staff ==============
    function UserView({ user, userId, initialTab, onClose }) {
      const { data } = useSWR('uact:' + user.id, () => gsRun('getUserActivity', user.id, userId), { revalidateOnFocus:false });
      const logs = data && data.success ? data.data : null;
      const profile = (
        <div>
          <div className="vm-id"><span className="vm-avatar"><i className="fas fa-user"></i></span>
            <div style={{flex:'1 1 200px'}}><div style={{fontSize:'17px', fontWeight:700, color:'var(--navy-primary)'}}>{user.username} <span className="status-badge" style={{marginLeft:'6px'}}>{user.role}</span></div>
              <div style={{color:'#789', fontSize:'13px'}}><i className="fas fa-envelope"></i> {user.email}</div></div></div>
          <VmFields rows={[['Role', user.role], ['Status', user.status], ['Created', fmtDate(user.created_at)], ['Last updated', fmtDate(user.updated_at)]]} />
          <p className="settings-card-sub" style={{marginTop:'10px'}}>Access is governed by the <b>{user.role}</b> role — edit it on the Roles &amp; Permissions page.</p>
        </div>
      );
      const actTab = logs == null ? <TableSkeleton rows={5} columns={3} /> : (logs.length ? <div className="about-table-wrapper"><table className="about-roles-table"><thead><tr><th>When</th><th>Action</th><th>Detail</th></tr></thead>
        <tbody>{logs.map((l, i) => <tr key={i}><td>{fmtDate(l.created)}</td><td><span className="status-badge">{l.action_type}</span></td><td>{l.description}</td></tr>)}</tbody></table></div> : <VmEmpty text="No activity yet." />);
      return <ViewModal title={user.username} icon="fa-id-card" initialTab={initialTab} onClose={onClose} tabs={[
        { key:'profile', label:'Profile', icon:'fa-circle-info', content:profile },
        { key:'activity', label:'Activity', icon:'fa-clock-rotate-left', badge: logs ? logs.length : undefined, content:actTab }
      ]} />;
    }
    function UsersView({ userId, role, perms }) {
      const canAdd = can(perms, 'users', 'a'), canEdit = can(perms, 'users', 'e'), canDel = can(perms, 'users', 'd');
      const { data: res, mutate } = useSWR('users:all', () => gsRun('getUsers', userId), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const [show, setShow] = useState(false);
      const [editing, setEditing] = useState(null);
      const [viewU, setViewU] = useState(null);
      const [busy, setBusy] = useState('');

      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Access', text:res.message }); }, [res]);

      const cols = [
        { data:'id', title:'ID' },
        { data:'username', title:'Username', render:(d) => esc(d) },
        { data:'email', title:'Email', render:(d) => esc(d) },
        { data:'role', title:'Role', render:(d) => `<span class="status-badge">${esc(d)}</span>` },
        { data:'status', title:'Status', render:(d) => `<span class="status-badge status-${d === 'active' ? 'active' : 'inactive'}">${esc(d)}</span>` },
        { data:'created_at', title:'Created', render:(d) => fmtDay(d) },
        { data:null, title:'Actions', orderable:false, render:() =>
          ('<button class="action-icon" data-action="view" title="View"><i class="fas fa-eye"></i></button>' +
           '<button class="action-icon" data-action="activity" title="Activity"><i class="fas fa-clock-rotate-left"></i></button>' +
           '<button class="action-icon" data-action="more" title="More"><i class="fas fa-ellipsis-vertical"></i></button>') }
      ];
      const delUser = (row) => Swal.fire({ icon:'warning', title:'Delete user?', text:row.username, showCancelButton:true, confirmButtonColor:'var(--danger)', confirmButtonText:'Delete' }).then(r => { if (r.isConfirmed) { setBusy('Deleting…'); gsRun('deleteUser', row.id, userId).then(rr => { setBusy(''); if (rr.success) { Swal.fire({ icon:'success', title:'Deleted', timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:rr.message }); }); } });
      const onAction = (action, row, e) => {
        if (action === 'view') { setViewU({ user:row }); }
        else if (action === 'activity') { setViewU({ user:row, tab:'activity' }); }
        else if (action === 'more') {
          rowMenu(e, [
            { label:'Open', items:[{ icon:'fa-id-card', label:'View', onClick:() => setViewU({ user:row }) }, { icon:'fa-clock-rotate-left', label:'Activity', onClick:() => setViewU({ user:row, tab:'activity' }) }] },
            { label:'Manage', items:[canEdit ? { icon:'fa-edit', label:'Edit', onClick:() => { setEditing(row); setShow(true); } } : null, canDel ? { icon:'fa-trash', label:'Delete', danger:true, onClick:() => delUser(row) } : null].filter(Boolean) }
          ]);
        }
      };
      useDataTable('usersTable', rows, cols, { onAction, onRefresh:() => mutate() });

      const save = (form) => {
        setBusy(editing ? 'Updating…' : 'Saving…');
        const p = editing ? gsRun('updateUser', editing.id, form, userId) : gsRun('addUser', form, userId);
        p.then(r => { setBusy(''); if (r.success) { setShow(false); setEditing(null); Swal.fire({ icon:'success', title:r.message, timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:r.message }); });
      };

      return (
        <div className="data-section">
          <LoadingPopup text={busy} />
          <div className="section-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px', flexWrap:'wrap', gap:'10px'}}>
            <h2 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', margin:0}}><i className="fas fa-users-gear"></i> Users / Staff</h2>
            {canAdd && <button className="btn btn-primary" onClick={() => { setEditing(null); setShow(true); }}><i className="fas fa-plus"></i> Add User</button>}
          </div>
          {rows === undefined ? <TableSkeleton rows={6} columns={7} /> : <table id="usersTable" className="display" style={{width:'100%'}}></table>}
          {show && <UserModal user={editing} onClose={() => { setShow(false); setEditing(null); }} onSave={save} />}
          {viewU && <UserView user={viewU.user} initialTab={viewU.tab} userId={userId} onClose={() => setViewU(null)} />}
        </div>
      );
    }
    function UserModal({ user, onClose, onSave }) {
      const [f, setF] = useState({
        username: user?.username || '',
        email: user?.email || '',
        password: '',
        role: user?.role || 'employee',
        status: user?.status || 'active'
      });
      const roleOpts = [ { value:'owner', label:'Owner' }, { value:'manager', label:'Manager' }, { value:'employee', label:'Employee' } ];
      const statusOpts = [ { value:'active', label:'Active' }, { value:'inactive', label:'Inactive' } ];
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header"><h3><i className="fas fa-users-gear"></i> {user ? 'Edit' : 'Add'} User</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={(e) => {
                e.preventDefault();
                if (!f.username.trim() || !f.email.trim()) { Swal.fire({ icon:'warning', title:'Username & email required' }); return; }
                if (!user && !f.password.trim()) { Swal.fire({ icon:'warning', title:'Password required' }); return; }
                onSave(f);
              }}>
                <div className="form-grid">
                  <div className="form-group"><label><i className="fas fa-user"></i> Username *</label><input type="text" value={f.username} disabled={!!user} onChange={(e) => setF({ ...f, username:e.target.value })} required /></div>
                  <div className="form-group"><label><i className="fas fa-envelope"></i> Email *</label><input type="email" value={f.email} onChange={(e) => setF({ ...f, email:e.target.value })} required /></div>
                  <div className="form-group"><label><i className="fas fa-lock"></i> Password {user ? '' : '*'}</label><input type="text" value={f.password} placeholder={user ? 'leave blank to keep' : ''} onChange={(e) => setF({ ...f, password:e.target.value })} /></div>
                  <div className="form-group"><label><i className="fas fa-user-tag"></i> Role</label><SearchableDropdown options={roleOpts} value={f.role} onChange={(v) => setF({ ...f, role:v })} /></div>
                  <div className="form-group"><label><i className="fas fa-toggle-on"></i> Status</label><SearchableDropdown options={statusOpts} value={f.status} onChange={(v) => setF({ ...f, status:v })} /></div>
                </div>
                <div className="form-actions"><button type="submit" className="btn btn-primary"><i className="fas fa-save"></i> Save</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============== Used Phone Purchases ==============
    const USED_STAGES = [
      { key:'in_stock',    label:'In Stock',    color:'#0074D9', icon:'fa-warehouse' },
      { key:'refurbished', label:'Refurbished', color:'#b45309', icon:'fa-screwdriver-wrench' },
      { key:'sold',        label:'Sold',        color:'#2e7d32', icon:'fa-circle-check' }
    ];
    function UsedPhonesView({ userId, role, perms }) {
      const canAdd = can(perms, 'used_phones', 'a'), canEdit = can(perms, 'used_phones', 'e'), canDel = can(perms, 'used_phones', 'd');
      const { data: res, mutate } = useSWR('used_phones:all', () => gsRun('getUsedPhones', userId), { revalidateOnFocus:false });
      const { data: custRes } = useSWR('customers:all', () => gsRun('getCustomers', userId), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const customerOpts = (custRes && custRes.success ? custRes.data : []).map(c => ({ value:c.id, label:c.name + ' (' + c.phone + ')' }));
      const [show, setShow] = useState(false);
      const [editing, setEditing] = useState(null);
      const [busy, setBusy] = useState('');
      const [activeStatus, setActiveStatus] = useState(null);

      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Access', text:res.message }); }, [res]);

      const idTypeLabel = (t) => ({ id_card:'ID Card', driving_license:'Driving License', passport:'Passport', none:'None' }[t] || '—');

      const cols = [
        { data:'id', title:'ID' },
        { data:'device_name', title:'Device', render:(d) => esc(d) },
        { data:'brand', title:'Brand', render:(d) => esc(d) || '—' },
        { data:'model', title:'Model', render:(d) => esc(d) || '—' },
        { data:'storage', title:'Storage', render:(d) => esc(d) || '—' },
        { data:'imei', title:'IMEI', render:(d) => esc(d) },
        { data:'customer_name', title:'Seller', render:(d) => esc(d) },
        { data:'grade', title:'Grade', render:(d) => esc(d) || '—' },
        { data:'battery_health', title:'Battery', render:(d) => d ? d + '%' : '—' },
        { data:null, title:'Grades (S/B/Bd)', orderable:false, render:(x, t, row) => gradeChip(row.screen_condition) + ' ' + gradeChip(row.battery_grade) + ' ' + gradeChip(row.body_condition) },
        { data:'base_market_value', title:'Base Value', render:(d) => Number(d) ? money(d) : '—' },
        { data:'purchase_price', title:'Bought', render:(d) => money(d) },
        { data:'resale_price', title:'Resale', render:(d) => Number(d) ? money(d) : '—' },
        { data:'status', title:'Status', render:(d) => statusPill(d || 'in_stock') },
        { data:'created', title:'Added', render:(d) => fmtDay(d) },
        { data:null, title:'Actions', orderable:false, render:() =>
          ((canEdit ? '<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>' : '') +
           (canDel ? '<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>' : '') +
           '<button class="action-icon" data-action="contract" title="Contract"><i class="fas fa-file-contract"></i></button>') }
      ];

      const onAction = (action, row) => {
        if (action === 'edit') { setEditing(row); setShow(true); }
        else if (action === 'delete') {
          Swal.fire({ icon:'warning', title:'Delete record?', text:row.device_name, showCancelButton:true, confirmButtonColor:'var(--danger)', confirmButtonText:'Delete' }).then(r => {
            if (r.isConfirmed) { setBusy('Deleting…'); gsRun('deleteUsedPhone', row.id, userId).then(rr => { setBusy(''); if (rr.success) { Swal.fire({ icon:'success', title:'Deleted', timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:rr.message }); }); }
          });
        }
        else if (action === 'contract') {
          const html =
            '<div style="text-align:left;line-height:1.9">' +
            '<b>Device:</b> ' + esc(row.device_name || '—') + '<br>' +
            '<b>IMEI:</b> ' + esc(row.imei || '—') + '<br>' +
            '<b>Customer:</b> ' + esc(row.customer_name || '—') + '<br>' +
            '<b>ID Type:</b> ' + esc(idTypeLabel(row.id_type)) + '<br>' +
            '<b>ID Number:</b> ' + esc(row.id_number || '—') + '<br>' +
            '<b>Price:</b> ' + money(row.purchase_price) +
            (row.id_card_url ? '<br><b>ID Card:</b><br><a href="' + esc(row.id_card_url) + '" target="_blank" rel="noopener"><img src="' + esc(row.id_card_url) + '" style="max-height:120px;margin-top:4px;border:1px solid #cfd6dd;border-radius:3px"></a>' : '') +
            '</div>';
          Swal.fire({ icon:'info', title:'Purchase Contract', html:html, showCancelButton:true, confirmButtonText:'<i class="fas fa-print"></i> Print & Mark Printed', confirmButtonColor:'var(--navy-primary)' }).then(r => {
            if (!r.isConfirmed) return;
            if (printDoc(contractHTML(row), 'Contract ' + shopCtx().upPfx + padNo(row.id), 'a4')) gsRun('markUsedPhoneContract', row.id, userId).then(rr => { if (rr.success) mutate(); });
          });
        }
      };
      const stages = pipeStages(rows, USED_STAGES);
      const shown = rows === undefined ? undefined : (activeStatus ? rows.filter(r => r.status === activeStatus) : rows);
      useDataTable('usedPhonesTable', shown, cols, { onAction, onRefresh:() => mutate() });

      const save = (form) => {
        setBusy(editing ? 'Updating…' : 'Saving…');
        const p = editing ? gsRun('updateUsedPhone', editing.id, form, userId) : gsRun('addUsedPhone', form, userId);
