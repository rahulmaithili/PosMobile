    // ============== POS / Sales Checkout ==============
    function PosView({ userId, role, perms }) {
      const canSell = can(perms, 'pos', 'a');
      const { data: prodRes, mutate: mutateProducts } = useSWR('products:all', () => gsRun('getProducts', userId), { revalidateOnFocus:false });
      const { data: custRes, mutate: mutateCust } = useSWR('customers:all', () => gsRun('getCustomers', userId), { revalidateOnFocus:false });
      const products = prodRes && prodRes.success ? prodRes.data : [];
      const customers = custRes && custRes.success ? custRes.data : [];

      const [tab, setTab] = useState('register');
      const [cart, setCart] = useState([]);
      const [customerId, setCustomerId] = useState('');
      const [pay, setPay] = useState('cash');
      const [discount, setDiscount] = useState('');
      const [amountPaid, setAmountPaid] = useState('');
      const [redeemPts, setRedeemPts] = useState('');
      const [useCredit, setUseCredit] = useState('');
      const [busy, setBusy] = useState('');
      const [prodSearch, setProdSearch] = useState('');
      const [prodCat, setProdCat] = useState('');
      const [inStockOnly, setInStockOnly] = useState(false);

      const [heldCarts, setHeldCarts] = useState(() => {
        try {
          const saved = localStorage.getItem('pos_held_carts');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [showRecallModal, setShowRecallModal] = useState(false);

      useEffect(() => {
        localStorage.setItem('pos_held_carts', JSON.stringify(heldCarts));
      }, [heldCarts]);

      const currencyPresets = [
        { symbol: '₹', code: 'INR', position: 'before', label: 'INR (₹)' },
        { symbol: '€', code: 'EUR', position: 'before', label: 'EUR (€)' },
        { symbol: '$', code: 'USD', position: 'before', label: 'USD ($)' },
        { symbol: '£', code: 'GBP', position: 'before', label: 'GBP (£)' }
      ];
      const [cartCurrencyCode, setCartCurrencyCode] = useState(window.SHOP?.currency_code || 'INR');
      const selectedPreset = currencyPresets.find(p => p.code === cartCurrencyCode) || currencyPresets[0];

      const money = (n, customShop = null) => {
        var S = customShop || window.SHOP || {};
        var sym = customShop ? customShop.currency : selectedPreset.symbol;
        var dec = (S.currency_decimals === 0 || S.currency_decimals) ? parseInt(S.currency_decimals) : 2; if (isNaN(dec)) dec = 2;
        var v = (Number(n)||0).toFixed(dec);
        return S.currency_position === 'after' ? (v + ' ' + sym) : (sym + v);
      };

      const addToCart = (pid) => {
        const p = products.find(x => String(x.id) === String(pid));
        if (!p) return;
        if (Number(p.stock_qty) <= 0) { Swal.fire({ icon:'warning', title:'Out of stock', text:p.name }); return; }
        setCart(prev => {
          const ex = prev.find(c => c.product_id === p.id);
          if (ex) {
            if (ex.qty >= Number(p.stock_qty)) { Swal.fire({ icon:'warning', title:'Stock limit', text:`Only ${p.stock_qty} of ${p.name} in stock` }); return prev; }
            return prev.map(c => c.product_id === p.id ? { ...c, qty: c.qty + 1 } : c);
          }
          return [...prev, { product_id:p.id, name:p.name, qty:1, unit_price:Number(p.sale_price), vat_rate:Number(p.vat_rate), stock_qty:Number(p.stock_qty) }];
        });
      };

      const setQty = (pid, val) => {
        setCart(prev => prev.map(c => {
          if (c.product_id !== pid) return c;
          let q = parseInt(val) || 1;
          if (q < 1) q = 1;
          if (q > c.stock_qty) q = c.stock_qty;
          return { ...c, qty:q };
        }));
      };
      const removeLine = (pid) => setCart(prev => prev.filter(c => c.product_id !== pid));

      // net prices, VAT added per line
      let subtotal = 0, vat = 0;
      cart.forEach(c => {
        const net = c.unit_price * c.qty;
        const lineVat = Math.round(net * c.vat_rate / 100 * 100) / 100;
        subtotal += net; vat += lineVat;
      });
      subtotal = Math.round(subtotal * 100) / 100;
      vat = Math.round(vat * 100) / 100;
      const gross = Math.round((subtotal + vat) * 100) / 100;
      let disc = Math.round((parseFloat(discount) || 0) * 100) / 100;
      if (disc < 0) disc = 0;
      if (disc > gross) disc = gross;                                  // never below zero
      const total = Math.round((gross - disc) * 100) / 100;
      // loyalty + store-credit tender (mirrors backend; display only — backend recomputes)
      const S = window.SHOP || {};
      const loyOn = String(S.loyalty_enabled ?? '1') === '1';
      const ptVal = Number(S.loyalty_point_value) || 0.10, earnPer = Number(S.loyalty_earn_per) || 10;
      const sel = customers.find(c => String(c.id) === String(customerId));
      const ptBal = sel ? Number(sel.loyalty_points) || 0 : 0, creditBal = sel ? Number(sel.store_credit) || 0 : 0;
      const ptCap = ptVal > 0 ? Math.floor(total / ptVal) : 0;
      const usePts = Math.max(0, Math.min(parseInt(redeemPts) || 0, ptBal, ptCap));
      const redeemValue = Math.round(usePts * ptVal * 100) / 100;
      const creditApplied = Math.round(Math.min(parseFloat(useCredit) || 0, creditBal, Math.max(0, total - redeemValue)) * 100) / 100;
      const dueAfterTender = Math.round(Math.max(0, total - redeemValue - creditApplied) * 100) / 100;
      const willEarn = (sel && loyOn && earnPer > 0) ? Math.floor((total - redeemValue) / earnPer) : 0;
      const paid = amountPaid === '' ? dueAfterTender : Math.round((parseFloat(amountPaid) || 0) * 100) / 100;
      const change = Math.round(Math.max(0, paid - dueAfterTender) * 100) / 100;

      const checkout = () => {
        if (!cart.length || !canSell) return;
        setBusy('Processing sale…');
        gsRun('createSale', {
          customer_id: customerId || null, payment_method: pay, discount: disc, amount_paid: paid,
          redeem_points: usePts, apply_store_credit: creditApplied,
          currency: selectedPreset.symbol,
          currency_code: selectedPreset.code,
          currency_position: selectedPreset.position,
          items: cart.map(c => ({ product_id:c.product_id, qty:c.qty, unit_price:c.unit_price }))
        }, userId).then(r => {
          setBusy('');
          if (!r.success) { Swal.fire({ icon:'error', title:'Error', text:r.message }); return; }
          mutateProducts(); mutateCust && mutateCust();
          const sale = r.data; sale.customer_name = sel ? sel.name : 'Walk-in';
          Swal.fire({ icon:'success', title:'Sale Complete',
            html:`<div style="text-align:left">Sale ${esc(sale.invoice_no)}<br>Total: <b>${money(sale.total, sale)}</b><br>Change: <b>${money(sale.change_given, sale)}</b>${Number(sale.due_amount) > 0 ? '<br>Due: <b>' + money(sale.due_amount, sale) + '</b>' : ''}</div>`,
            showDenyButton:true, showCancelButton:true,
            confirmButtonText:'<i class="fas fa-receipt"></i> Print Receipt', denyButtonText:'<i class="fas fa-file-invoice"></i> A4 Invoice', cancelButtonText:'Done',
            confirmButtonColor:'var(--navy-primary)', denyButtonColor:'#0074D9'
          }).then(res => {
            if (res.isConfirmed && printDoc(receiptHTML(sale), 'Receipt ' + sale.invoice_no, shopCtx().size)) gsRun('markReceiptPrinted', sale.id, userId);
            else if (res.isDenied && printDoc(invoiceHTML(sale), 'Invoice ' + sale.invoice_no, 'a4')) gsRun('markReceiptPrinted', sale.id, userId);
          });
          setCart([]); setCustomerId(''); setDiscount(''); setAmountPaid(''); setRedeemPts(''); setUseCredit('');
        });
      };

      const holdCurrentBill = () => {
        if (!cart.length) return;
        const defaultName = sel ? sel.name : ('Draft ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
        Swal.fire({
          title: 'Hold Current Bill',
          text: 'Enter a reference name to identify this draft:',
          input: 'text',
          inputValue: defaultName,
          showCancelButton: true,
          confirmButtonText: 'Hold Bill',
          confirmButtonColor: 'var(--navy-accent)',
          inputValidator: (value) => {
            if (!value.trim()) return 'Please enter a name!';
          }
        }).then(res => {
          if (res.isConfirmed) {
            const refName = res.value.trim();
            const newHeld = {
              id: Date.now(),
              name: refName,
              cart,
              customerId,
              discount,
              redeemPts,
              useCredit,
              pay,
              cartCurrencyCode,
              created: new Date().toISOString()
            };
            setHeldCarts(prev => [newHeld, ...prev]);
            setCart([]); setCustomerId(''); setDiscount(''); setAmountPaid(''); setRedeemPts(''); setUseCredit('');
            Swal.fire({ icon:'success', title:'Bill Placed on Hold', text:`"${refName}" saved`, timer:1100, showConfirmButton:false });
          }
        });
      };

      const recallBill = (held) => {
        const load = () => {
          setCart(held.cart);
          setCustomerId(held.customerId || '');
          setDiscount(held.discount || '');
          setRedeemPts(held.redeemPts || '');
          setUseCredit(held.useCredit || '');
          setPay(held.pay || 'cash');
          if (held.cartCurrencyCode) setCartCurrencyCode(held.cartCurrencyCode);
          
          setHeldCarts(prev => prev.filter(x => x.id !== held.id));
          setShowRecallModal(false);
          Swal.fire({ icon:'success', title:'Bill Resumed', timer:900, showConfirmButton:false });
        };
        if (cart.length > 0) {
          Swal.fire({
            title: 'Overwrite current cart?',
            text: 'Your cart is not empty. Resuming this draft will overwrite current cart items.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, Overwrite',
            confirmButtonColor: 'var(--navy-accent)'
          }).then(res => {
            if (res.isConfirmed) load();
          });
        } else {
          load();
        }
      };

      const discardHeld = (id) => {
        Swal.fire({
          title: 'Discard draft?',
          text: 'This draft will be permanently deleted.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#b91c1c',
          confirmButtonText: 'Delete'
        }).then(res => {
          if (res.isConfirmed) {
            setHeldCarts(prev => prev.filter(x => x.id !== id));
            Swal.fire({ icon:'success', title:'Draft Discarded', timer:900, showConfirmButton:false });
          }
        });
      };

      const custOpts = customers.map(c => ({ value:c.id, label:`${c.name} (${c.phone})` }));

      // product picker filter (search + category)
      const catOpts = [{ value:'', label:'All categories' }, { value:'phone', label:'Phones' }, { value:'accessory', label:'Accessories' }, { value:'repair_part', label:'Repair Parts' }];
      const catLabel = (c) => ({ phone:'Phone', accessory:'Accessory', repair_part:'Repair Part' }[c] || c || '—');
      const q = prodSearch.trim().toLowerCase();
      const filtered = products.filter(p => {
        if (prodCat && (p.category || '') !== prodCat) return false;
        if (inStockOnly && Number(p.stock_qty) <= 0) return false;
        if (!q) return true;
        return String(p.name).toLowerCase().includes(q) || String(p.barcode || '').toLowerCase().includes(q) || String(p.brand || '').toLowerCase().includes(q);
      });

      return (
        <div className="data-section">
          <LoadingPopup text={busy} />
          <div className="section-header" style={{display:'flex', alignItems:'center', gap:'8px', marginBottom:'14px'}}>
            <h2 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', margin:0}}><i className="fas fa-cash-register"></i> Point of Sale</h2>
          </div>

          <div className="pos-subtabs" style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'10px', marginBottom:'14px'}}>
            <div style={{display:'flex', gap:'5px'}}>
              <button className={'pos-subtab' + (tab === 'register' ? ' active' : '')} onClick={() => setTab('register')}><i className="fas fa-cash-register"></i> Register</button>
              <button className={'pos-subtab' + (tab === 'history' ? ' active' : '')} onClick={() => setTab('history')}><i className="fas fa-clock-rotate-left"></i> Sales History</button>
              <button className={'pos-subtab' + (tab === 'returns' ? ' active' : '')} onClick={() => setTab('returns')}><i className="fas fa-rotate-left"></i> Returns &amp; Refunds</button>
            </div>
            {heldCarts.length > 0 && tab === 'register' && (
              <button className="btn btn-secondary btn-sm" onClick={() => setShowRecallModal(true)} style={{padding:'5px 12px', background:'var(--navy-accent)', border:'none', color:'#fff', display:'flex', alignItems:'center', gap:'6px', borderRadius:'6px'}}>
                <i className="fas fa-folder-open"></i> Held Drafts <span style={{background:'#fff', color:'var(--navy-primary)', padding:'1px 6px', borderRadius:'10px', fontSize:'11px', fontWeight:'700'}}>{heldCarts.length}</span>
              </button>
            )}
          </div>

          {tab === 'history' ? <SalesHistory userId={userId} role={role} perms={perms} /> : tab === 'returns' ? <ReturnsLog userId={userId} role={role} perms={perms} /> : !canSell ? (
            <div className="form-group" style={{textAlign:'center', padding:'30px', color:'var(--navy-primary)'}}>
              <i className="fas fa-lock" style={{fontSize:'28px', marginBottom:'10px'}}></i>
              <p style={{margin:0}}>You don't have permission to make sales.</p>
            </div>
          ) : (
            <div className="pos-grid">
              <div>
                <h3 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', marginTop:0}}><i className="fas fa-barcode"></i> Add Items</h3>
                <div className="pos-filter-bar">
                  <div className="pos-search">
                    <i className="fas fa-magnifying-glass"></i>
                    <input type="text" value={prodSearch} onChange={(e) => setProdSearch(e.target.value)} placeholder="Search name, brand or barcode…" />
                  </div>
                  <div style={{minWidth:'170px'}}>
                    <SearchableDropdown options={catOpts} value={prodCat} onChange={setProdCat} placeholder="All categories" />
                  </div>
                  <button type="button" className={'pos-stock-toggle' + (inStockOnly ? ' on' : '')} onClick={() => setInStockOnly(v => !v)} title="Show only products in stock">
                    <i className={'fas ' + (inStockOnly ? 'fa-circle-check' : 'fa-circle')}></i> In stock
                  </button>
                </div>
                {prodRes !== undefined && <div className="pos-pick-count"><i className="fas fa-box-open"></i> Showing {filtered.length} of {products.length} products — click to add</div>}
                {prodRes === undefined ? (
                  <ProductGridSkeleton />
                ) : !filtered.length ? (
                  <div className="pos-pick-empty"><i className="fas fa-magnifying-glass-minus"></i> No products match your filter.</div>
                ) : (
                  <div className="pos-prod-grid">
                    {filtered.map(p => {
                      const oos = Number(p.stock_qty) <= 0;
                      const stockCls = oos ? 'out' : (p.low ? 'low' : 'in');
                      return (
                        <button type="button" key={p.id} className={'pos-prod-card' + (oos ? ' oos' : '')} disabled={oos} onClick={() => addToCart(p.id)} title={oos ? 'Out of stock' : 'Add to cart'}>
                          <span className="pos-prod-imgwrap">
                            <span className="pos-prod-thumb ph"><i className="fas fa-image"></i></span>
                            {p.image_url && <img className="pos-prod-thumb" style={{position:'absolute', inset:0}} src={p.image_url} alt="" loading="lazy" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />}
                            <span className={'pp-cat chip-' + (p.category || 'phone')}>{catLabel(p.category)}</span>
                            {p.images && p.images.length > 1 && <span className="img-count"><i className="fas fa-images"></i> {p.images.length}</span>}
                          </span>
                          <span className="pos-prod-body">
                            <span className="pp-name">{p.name}</span>
                            <span className="pp-meta">
                              <span className="pp-price">{money(p.sale_price)}</span>
                              <span className={'pp-stock ' + stockCls}>{oos ? 'Out' : p.stock_qty + ' left'}</span>
                            </span>
                          </span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>

              <div>
                <h3 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', marginTop:0}}><i className="fas fa-cart-shopping"></i> Cart</h3>

                {!cart.length && <p style={{color:'#789', padding:'14px 0'}}><i className="fas fa-cart-flatbed"></i> Cart is empty — add a product.</p>}

                {cart.map(c => (
                  <div className="cart-line" key={c.product_id}>
                    <span style={{flex:'1 1 auto', fontWeight:600}}>{c.name}</span>
                    <input className="cart-qty" type="number" min="1" max={c.stock_qty} value={c.qty}
                           onChange={(e) => setQty(c.product_id, e.target.value)} />
                    <span style={{minWidth:'70px', textAlign:'right'}}>{money(c.unit_price)}</span>
                    <span style={{minWidth:'80px', textAlign:'right', fontWeight:600}}>{money(c.unit_price * c.qty)}</span>
                    <button className="btn btn-secondary" style={{padding:'2px 9px'}} title="Remove" onClick={() => removeLine(c.product_id)}>×</button>
                  </div>
                ))}

                <div className="form-group" style={{marginTop:'14px'}}>
                  <label><i className="fas fa-user"></i> Customer (optional)</label>
                  <SearchableDropdown options={custOpts} value={customerId} onChange={setCustomerId} placeholder="Walk-in" />
                </div>

                {sel && loyOn && (
                  <div className="pos-loyalty-panel">
                    <span className="lp-chip"><i className="fas fa-star"></i> {ptBal} pts <span style={{color:'#789', fontWeight:400}}>({money(ptBal * ptVal)})</span></span>
                    <span className="lp-chip"><i className="fas fa-wallet"></i> Credit {money(creditBal)}</span>
                  </div>
                )}
                {sel && loyOn && (ptBal > 0 || creditBal > 0) && (
                  <div className="form-grid" style={{gridTemplateColumns:'1fr 1fr', gap:'10px'}}>
                    {ptBal > 0 && <div className="form-group" style={{margin:0}}><label><i className="fas fa-star"></i> Redeem points</label><input type="number" min="0" max={Math.min(ptBal, ptCap)} value={redeemPts} onChange={(e) => setRedeemPts(e.target.value)} placeholder="0" /></div>}
                    {creditBal > 0 && <div className="form-group" style={{margin:0}}><label><i className="fas fa-wallet"></i> Use credit</label><input type="number" step="0.01" min="0" max={Math.min(creditBal, Math.max(0, total - redeemValue))} value={useCredit} onChange={(e) => setUseCredit(e.target.value)} placeholder="0.00" /></div>}
                  </div>
                )}

                <div className="form-group">
                  <label><i className="fas fa-coins"></i> Currency</label>
                  <select className="swal2-select" style={{width:'100%', margin:0, background:'rgba(255,255,255,0.05)', color:'#fff', border:'1px solid rgba(255,255,255,0.2)', borderRadius:'6px', padding:'10px'}}
                          value={cartCurrencyCode} onChange={(e) => setCartCurrencyCode(e.target.value)}>
                    {currencyPresets.map(p => <option key={p.code} value={p.code} style={{background:'#001529'}}>{p.label}</option>)}
                  </select>
                </div>

                <div className="form-group">
                  <label><i className="fas fa-wallet"></i> Payment</label>
                  <SearchableDropdown
                    options={[{value:'cash', label:'Cash'}, {value:'card', label:'Card'}, {value:'bank_transfer', label:'Bank Transfer'}]}
                    value={pay} onChange={setPay} placeholder="Payment method" />
                </div>

                <div className="form-group">
                  <label><i className="fas fa-tag"></i> Discount</label>
                  <input type="number" step="0.01" min="0" value={discount} onChange={(e) => setDiscount(e.target.value)} placeholder="0.00" />
                </div>

                <div className="pos-total-row"><span>Subtotal</span><span>{money(subtotal)}</span></div>
                <div className="pos-total-row"><span>VAT</span><span>{money(vat)}</span></div>
                {disc > 0 && <div className="pos-total-row"><span>Discount</span><span>− {money(disc)}</span></div>}
                <div className="pos-total-row grand"><span>Total</span><span>{money(total)}</span></div>
                {redeemValue > 0 && <div className="pos-total-row"><span>Points redeemed</span><span>− {money(redeemValue)}</span></div>}
                {creditApplied > 0 && <div className="pos-total-row"><span>Store credit</span><span>− {money(creditApplied)}</span></div>}
                {(redeemValue > 0 || creditApplied > 0) && <div className="pos-total-row grand"><span>Amount Due</span><span>{money(dueAfterTender)}</span></div>}
                {willEarn > 0 && <div className="pos-total-row" style={{color:'#2e7d32', fontSize:'12px'}}><span><i className="fas fa-star"></i> Earns</span><span>{willEarn} pts</span></div>}

                <div className="form-group" style={{marginTop:'10px'}}>
                  <label><i className="fas fa-money-bill-wave"></i> Cash Received</label>
                  <input type="number" step="0.01" min="0" value={amountPaid} onChange={(e) => setAmountPaid(e.target.value)} placeholder={dueAfterTender.toFixed(2)} />
                </div>
                <div className="pos-total-row"><span>Change</span><span>{money(change)}</span></div>

                <div style={{display:'flex', gap:'10px', marginTop:'14px'}}>
                  {cart.length > 0 && (
                    <button type="button" className="btn btn-secondary" style={{flex: 1, display:'flex', alignItems:'center', justifyContent:'center', gap:'6px'}} onClick={holdCurrentBill}>
                      <i className="fas fa-pause"></i> Hold
                    </button>
                  )}
                  <button className="btn btn-primary" style={{flex: cart.length > 0 ? 2 : 1}}
                          disabled={!cart.length || !canSell} onClick={checkout}>
                    <i className="fas fa-check"></i> Checkout
                  </button>
                </div>
              </div>
            </div>
          )}

          {showRecallModal && (
            <RecallHeldBillsModal
              heldCarts={heldCarts}
              onRecall={recallBill}
              onDelete={discardHeld}
              onClose={() => setShowRecallModal(false)}
              money={money}
            />
          )}
        </div>
      );
    }

    // ---- Sales History (POS sub-tab) — reprint + returns ----
    function round2(n){ return Math.round((Number(n) || 0) * 100) / 100; }
    function monthStart(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }
    function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    const SALE_PAY_STAGES = [
      { key:'paid',    label:'Paid',    color:'#2e7d32', icon:'fa-circle-check' },
      { key:'partial', label:'Partial', color:'#b45309', icon:'fa-hourglass-half' },
      { key:'unpaid',  label:'Unpaid',  color:'#b91c1c', icon:'fa-circle-exclamation' }
    ];
    function SalesHistory({ userId, role, perms }) {
      const canReturn = can(perms, 'pos', 'e'), canVoid = can(perms, 'pos', 'd');
      const [from, setFrom] = useState(monthStart());
      const [to, setTo] = useState(todayStr());
      const [activeStatus, setActiveStatus] = useState(null);
      const [returning, setReturning] = useState(null);
      const [busy, setBusy] = useState('');
      const { data: res, mutate } = useSWR(`sales:history:${from}:${to}`, () => gsRun('getSales', userId, from || null, to || null), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;

      const retPill = (s) => { s = s || 'none'; const c = s === 'full' ? '#b91c1c' : s === 'partial' ? '#b45309' : '#2e7d32'; return '<span style="display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;background:' + c + '">' + s + '</span>'; };
      const cols = [
        { data:'invoice_no', title:'Invoice', render:(d) => esc(d) || '—' },
        { data:'created', title:'Date', render:(d) => fmtDate(d) },
        { data:'customer_name', title:'Customer', render:(d) => esc(d) },
        { data:'cashier_name', title:'Cashier', render:(d) => esc(d) },
        { data:'items', title:'Items', render:(d) => (d && d.length) || 0 },
        { data:'total', title:'Total', render:(v, type, row) => money(v, row) },
        { data:'payment_method', title:'Method', render:(d) => `<span class="status-badge">${esc((d || '').replace('_', ' '))}</span>` },
        { data:'amount_paid', title:'Paid', render:(v, type, row) => money(v, row) },
        { data:'due_amount', title:'Due', render:(v, type, row) => Number(v) ? `<span style="color:#b91c1c;font-weight:700">${money(v, row)}</span>` : money(0, row) },
        { data:'payment_status', title:'Status', render:(d) => statusPill(d) },
        { data:'return_status', title:'Return', render:(d) => retPill(d) },
        { data:null, title:'Actions', orderable:false, render:(x, t, row) =>
          '<button class="action-icon" data-action="receipt" title="Reprint Receipt"><i class="fas fa-receipt"></i></button>' +
          '<button class="action-icon" data-action="invoice" title="Print A4 Invoice"><i class="fas fa-file-invoice"></i></button>' +
          '<button class="action-icon" data-action="view" title="View"><i class="fas fa-eye"></i></button>' +
          ((canReturn && (row.return_status || 'none') !== 'full') ? '<button class="action-icon" data-action="return" title="Return / Refund" style="color:#b45309"><i class="fas fa-rotate-left"></i></button>' : '') +
          ((canVoid && (row.return_status || 'none') === 'none') ? '<button class="action-icon delete-icon" data-action="void" title="Void"><i class="fas fa-ban"></i></button>' : '') }
      ];
      const refreshAll = () => { mutate(); swrMutate('products:all', undefined, true, () => gsRun('getProducts', userId)); swrMutate('customers:all', undefined, true, () => gsRun('getCustomers', userId)); swrMutate('dash:stats', undefined, true, () => gsRun('getDashboardStats', userId)); };
      const onAction = (action, row) => {
        if (action === 'receipt') { if (printDoc(receiptHTML(row), 'Receipt ' + row.invoice_no, shopCtx().size)) gsRun('markReceiptPrinted', row.id, userId).then(() => mutate()); }
        else if (action === 'invoice') { if (printDoc(invoiceHTML(row), 'Invoice ' + row.invoice_no, 'a4')) gsRun('markReceiptPrinted', row.id, userId).then(() => mutate()); }
        else if (action === 'view') {
          const lines = (row.items || []).map(l => `${esc(l.name)} ×${l.qty} — ${money(l.line_total, row)}`).join('<br>');
          Swal.fire({ title: esc(row.invoice_no || 'Sale'), html:`<div style="text-align:left;font-size:13px">${lines}<hr>Total: <b>${money(row.total, row)}</b><br>Paid: ${money(row.amount_paid, row)} · Due: ${money(row.due_amount, row)}<br>Status: ${esc(row.payment_status)}${row.return_status && row.return_status !== 'none' ? ' · Return: ' + esc(row.return_status) : ''}</div>` });
        }
        else if (action === 'return') { setReturning(row); }
        else if (action === 'void') {
          Swal.fire({ icon:'warning', title:'Void sale?', text:'Same-day cancellation — restores stock & reverses tenders.', showCancelButton:true, confirmButtonColor:'var(--danger)', confirmButtonText:'Void' }).then(r => {

          });

      };
      const stages = pipeStages((rows || []).map(r => ({ status: r.payment_status })), SALE_PAY_STAGES);
      const shown = rows === undefined ? undefined : (activeStatus ? rows.filter(r => r.payment_status === activeStatus) : rows);
      useDataTable('salesHistoryTable', shown, cols, { onAction, onRefresh: refreshAll, dt:{ order:[[1, 'desc']], createdRow:(tr, row) => { if (Number(row.due_amount) > 0) tr.classList.add('row-warn'); if ((row.return_status || 'none') === 'full') tr.classList.add('row-danger'); } } });
      const sumT = (shown || []).reduce((a, s) => ({ total:a.total + Number(s.total || 0), paid:a.paid + Number(s.amount_paid || 0), due:a.due + Number(s.due_amount || 0) }), { total:0, paid:0, due:0 });

      return (

            <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-day"></i> To</label><input type="date" value={to} onChange={(e) => setTo(e.target.value)} /></div>
          </div>
          {rows !== undefined && <PipelineTabs stages={stages} active={activeStatus} onPick={setActiveStatus} total={rows.length} />}
          {rows === undefined ? <TableSkeleton rows={6} columns={11} /> : <table id="salesHistoryTable" className="display" style={{width:'100%'}}></table>}
          {rows !== undefined && (shown || []).length > 0 && <div className="table-summary"><span><i className="fas fa-receipt"></i> Sales:<b>{(shown || []).length}</b></span><span><i className="fas fa-cash-register"></i> Total:<b>{money(sumT.total)}</b></span><span><i className="fas fa-money-bill-wave"></i> Paid:<b>{money(sumT.paid)}</b></span><span><i className="fas fa-hand-holding-dollar"></i> Due:<b>{money(sumT.due)}</b></span></div>}
          {returning && <ReturnModal sale={returning} userId={userId} onClose={() => setReturning(null)} onDone={() => { setReturning(null); refreshAll(); }} />}

    }
    // Returns & Refunds — its own POS tab
    function ReturnsLog({ userId, role, perms }) {

      const [to, setTo] = useState(todayStr());
      const { data: res, mutate } = useSWR(`returns:${from}:${to}`, () => gsRun('getReturns', userId, from || null, to || null), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;

        { data:'return_no', title:'Return', render:(d) => esc(d) || '—' },
        { data:'created', title:'Date', render:(d) => fmtDate(d) },
        { data:'invoice_no', title:'Invoice', render:(d) => esc(d) },
        { data:'customer_name', title:'Customer', render:(d) => esc(d) },
        { data:'refund_total', title:'Refund', render:(v) => money(v) },
        { data:'cash_refunded', title:'Cash Out', render:(v) => money(v) },

      const sum = (rows || []).reduce((a, r) => ({ refund:a.refund + Number(r.refund_total || 0), cash:a.cash + Number(r.cash_refunded || 0) }), { refund:0, cash:0 });
      return (
        <div>
          <div className="filters-section" style={{display:'flex', gap:'10px', alignItems:'flex-end', flexWrap:'wrap', marginBottom:'14px'}}>
            <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-day"></i> From</label><input type="date" value={from} onChange={(e) => setFrom(e.target.value)} /></div>
            <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-day"></i> To</label><input type="date" value={to} onChange={(e) => setTo(e.target.value)} /></div>
          </div>
          {rows === undefined ? <TableSkeleton rows={6} columns={9} /> : (rows.length ? <table id="returnsTable" className="display" style={{width:'100%'}}></table> : <VmEmpty text="No returns or refunds in this range." />)}
          {rows !== undefined && rows.length > 0 && <div className="table-summary"><span><i className="fas fa-rotate-left"></i> Returns:<b>{rows.length}</b></span><span><i className="fas fa-receipt"></i> Refund total:<b>{money(sum.refund)}</b></span><span><i className="fas fa-money-bill-wave"></i> Cash out:<b>{money(sum.cash)}</b></span></div>}

    }
    function ReturnModal({ sale, onClose, onDone, userId }) {
      const reasonOpts = ((window.SHOP && window.SHOP.return_reasons) || 'Defective/Faulty,Wrong item,Customer changed mind,Not as described,Warranty claim,Other').split(',').map(s => s.trim()).filter(Boolean).map(r => ({ value:r, label:r }));
      const lines = (sale.items || []).map(l => ({ ...l, returnable: Number(l.qty) - Number(l.returned_qty || 0) }));
      const [qtys, setQtys] = useState({});
      const [reason, setReason] = useState(reasonOpts[0] ? reasonOpts[0].value : '');
      const [method, setMethod] = useState('cash');
      const [restock, setRestock] = useState(true);
      const [busy, setBusy] = useState('');
      const setQ = (pid, v, max) => { let q = parseInt(v) || 0; if (q < 0) q = 0; if (q > max) q = max; setQtys(s => ({ ...s, [pid]: q })); };

      const D = Number(sale.discount) || 0, gross = round2(Number(sale.subtotal) + Number(sale.vat_gross));
      let rSub = 0, rVatGross = 0; const picked = [];
      lines.forEach(l => { const q = qtys[l.product_id] || 0; if (q <= 0) return; const net = round2(l.unit_price * q), vat = round2(net * l.vat_rate / 100); rSub = round2(rSub + net); rVatGross = round2(rVatGross + vat); picked.push({ product_id:l.product_id, qty:q }); });
      const rGross = round2(rSub + rVatGross);
      const discountShare = gross > 0 ? round2(D * rGross / gross) : 0;
      const refundTotal = round2(rGross - discountShare);

      const submit = () => {
        if (!picked.length) { Swal.fire({ icon:'warning', title:'Select at least one item' }); return; }
        if (method === 'store_credit' && !sale.customer_id) { Swal.fire({ icon:'warning', title:'Store credit needs a customer on the sale' }); return; }
        setBusy('Processing…');
        gsRun('createReturn', sale.id, { items: picked, reason, refund_method: method, restock: restock ? 1 : 0 }, userId).then(r => {
          setBusy('');
          if (r.success) { Swal.fire({ icon:'success', title:'Refund processed', html:`${esc(r.data.return_no)} · Refund <b>${money(r.cash_refunded)}</b>`, timer:1700, showConfirmButton:false }); onDone(); }
          else Swal.fire({ icon:'error', title:'Error', text:r.message });
        });
      };
      return (
        <div className="modal-overlay" onClick={onClose}>
          <LoadingPopup text={busy} />
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'620px'}}>

                  <tbody>{lines.map(l => (
                    <tr key={l.product_id}>
                      <td>{l.name}</td><td>{l.qty}</td><td>{l.returnable}</td>
                      <td>{l.returnable > 0 ? <input type="number" min="0" max={l.returnable} value={qtys[l.product_id] || ''} onChange={(e) => setQ(l.product_id, e.target.value, l.returnable)} style={{width:'72px'}} /> : <span style={{color:'#999'}}>fully returned</span>}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
              <div className="form-grid">
                <div className="form-group"><label><i className="fas fa-comment"></i> Reason</label><SearchableDropdown options={reasonOpts} value={reason} onChange={setReason} placeholder="Reason" /></div>
                <div className="form-group"><label><i className="fas fa-money-bill-transfer"></i> Refund Method</label><SearchableDropdown options={[{value:'cash',label:'Cash'},{value:'card',label:'Card'},{value:'bank_transfer',label:'Bank Transfer'},{value:'store_credit',label:'Store Credit'}]} value={method} onChange={setMethod} placeholder="Method" /></div>
              </div>
              <div className="settings-toggle-row"><div className="grow"><div className="lbl"><i className="fas fa-box"></i> Restock items</div><div className="desc">Return goods to sellable inventory (reverses COGS).</div></div><input type="checkbox" className="toggle" checked={restock} onChange={(e) => setRestock(e.target.checked)} /></div>
              <div className="pos-total-row grand" style={{marginTop:'10px'}}><span>Refund total</span><span>{money(refundTotal)}</span></div>
              {Number(sale.due_amount) > 0 && <div className="pos-total-row" style={{fontSize:'12px', color:'#789'}}><span>Open due on sale (offsets refund cash)</span><span>{money(sale.due_amount)}</span></div>}
              <div className="form-actions"><button type="button" className="btn btn-primary" onClick={submit}><i className="fas fa-check"></i> Process Refund</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
            </div>
          </div>
        </div>
      );
    }

    // ============== Repairs ==============
    const REPAIR_STAGES = [
      { key:'in_repair', label:'In Repair', color:'#b45309', icon:'fa-screwdriver-wrench' },
      { key:'repaired',  label:'Repaired',  color:'#0074D9', icon:'fa-circle-check' },
      { key:'delivered', label:'Delivered', color:'#2e7d32', icon:'fa-handshake' }
    ];
    function RepairsView({ userId, role, perms }) {
      const canAdd = can(perms, 'repairs', 'a'), canEdit = can(perms, 'repairs', 'e'), canDel = can(perms, 'repairs', 'd');
      const { data: res, mutate } = useSWR('repairs:all', () => gsRun('getRepairs', userId), { revalidateOnFocus:false });
      const { data: custRes } = useSWR('customers:all', () => gsRun('getCustomers', userId), { revalidateOnFocus:false });
      const { data: techRes } = useSWR('users:all', () => gsRun('getUsers', userId), { revalidateOnFocus:false });
      const { data: prodRes } = useSWR('products:all', () => gsRun('getProducts', userId), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const customerOpts = (custRes && custRes.success ? custRes.data : []).map(c => ({ value:c.id, label:c.name + ' — ' + c.phone }));
      const techOpts = (techRes && techRes.success ? techRes.data : []).map(u => ({ value:u.id, label:u.username }));
      const partOpts = (prodRes && prodRes.success ? prodRes.data : []).filter(p => p.category === 'repair_part').map(p => ({ value:p.id, label:p.name + ' (' + p.stock_qty + ' in stock)' }));
      const [show, setShow] = useState(false);

      const [activeStatus, setActiveStatus] = useState(null);

      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Access', text:res.message }); }, [res]);

      const cols = [
        { data:'ticket_no', title:'Ticket', render:(d) => esc(d) || '—' },
        { data:'device_name', title:'Device', render:(d) => esc(d) },
        { data:'brand', title:'Brand', render:(d) => esc(d) || '—' },
        { data:'customer_name', title:'Customer', render:(d) => esc(d) },
        { data:'tech_name', title:'Technician', render:(d) => esc(d) },
        { data:'total_cost', title:'Total', render:(v) => money(v) },
        { data:'paid_amount', title:'Paid', render:(v) => money(v) },
        { data:'remaining_amount', title:'Remaining', render:(v) => money(v) },
        { data:'priority', title:'Priority', render:(d) => esc(d || 'normal') },
        { data:'due_date', title:'Due', render:(d) => esc(d) || '—' },
        { data:'status', title:'Status', render:(s) => statusPill(s) },
        { data:'whatsapp_sent', title:'WA', className:'dt-center', render:(v, t, row) => row.whatsapp_sent ? '<i class="fas fa-check" style="color:#2e7d32"></i>' : '<i class="fas fa-xmark" style="color:#bbb"></i>' },
        { data:null, title:'Actions', orderable:false, render:() =>
          ((canEdit ? '<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>' : '') +
           '<button class="action-icon" data-action="ticket" title="Print Ticket"><i class="fas fa-print"></i></button>' +
           '<button class="action-icon" data-action="wa" title="WhatsApp" style="color:#25d366"><i class="fa-brands fa-whatsapp"></i></button>' +
           '<button class="action-icon" data-action="copy-link" title="Copy Tracking Link"><i class="fas fa-link"></i></button>' +
           '<button class="action-icon" data-action="track-wa" title="Share Tracking Link on WhatsApp" style="color:#25d366"><i class="fa-brands fa-whatsapp"></i></button>' +
           (canDel ? '<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>' : '')) }
      ];
      const onAction = (action, row) => {
        if (action === 'edit') { setEditing(row); setShow(true); }
        else if (action === 'ticket') { if (printDoc(ticketHTML(row), 'Ticket ' + row.ticket_no, shopCtx().size)) gsRun('markRepairReceipt', row.id, userId).then(() => mutate()); }
        else if (action === 'delete') {
          Swal.fire({ icon:'warning', title:'Delete repair?', text:row.device_name, showCancelButton:true, confirmButtonColor:'var(--danger)', confirmButtonText:'Delete' }).then(r => {
            if (r.isConfirmed) { setBusy('Deleting…'); gsRun('deleteRepair', row.id, userId).then(rr => { setBusy(''); if (rr.success) { Swal.fire({ icon:'success', title:'Deleted', timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:rr.message }); }); }
          });
        }
        else if (action === 'wa') {
          gsRun('getRepairWaLink', row.id, userId).then(r => {
            if (r.success) { window.open(r.link, '_blank'); gsRun('markRepairWhatsapp', row.id, userId).then(() => mutate()); }
            else Swal.fire({ icon:'error', title:'Error', text:r.message });
          });
        }
        else if (action === 'copy-link') {
          gsRun('getRepairTrackLink', row.id, userId).then(r => {
            if (!r.success) { Swal.fire({ icon:'error', title:'Error', text:r.message }); return; }
            navigator.clipboard.writeText(r.url).then(() => Swal.fire({ icon:'success', title:'Tracking link copied', timer:1100, showConfirmButton:false }));
          });
        }
        else if (action === 'track-wa') {
          gsRun('getRepairTrackLink', row.id, userId).then(r => {
            if (r.success) window.open(r.waLink, '_blank');
            else Swal.fire({ icon:'error', title:'Error', text:r.message });
          });
        }
      };
      const stages = pipeStages(rows, REPAIR_STAGES);
      const shown = rows === undefined ? undefined : (activeStatus ? rows.filter(r => r.status === activeStatus) : rows);
      const todayY = todayStr();
      useDataTable('repairsTable', shown, cols, { onAction, onRefresh:() => mutate(), dt:{ createdRow:(tr, row) => { if (row.due_date && row.due_date < todayY && row.status !== 'delivered') tr.classList.add('row-danger'); else if (Number(row.remaining_amount) > 0) tr.classList.add('row-warn'); } } });
      const sumR = (shown || []).reduce((a, r) => ({ total:a.total + Number(r.total_cost || 0), paid:a.paid + Number(r.paid_amount || 0), rem:a.rem + Number(r.remaining_amount || 0) }), { total:0, paid:0, rem:0 });

    function RepairModal({ repair, customerOpts, techOpts, partOpts, onClose, onSave }) {

        customer_id: repair?.customer_id || '',
        assigned_user_id: repair?.assigned_user_id || '',
        device_name: repair?.device_name || '',
        brand: repair?.brand || '',
        model: repair?.model || '',
        color: repair?.color || '',
        problem_description: repair?.problem_description || '',
        diagnosis: repair?.diagnosis || '',
        priority: repair?.priority || 'normal',
        total_cost: repair?.total_cost != null ? repair.total_cost : '',

        paid_amount: repair?.paid_amount != null ? repair.paid_amount : '',

        device_imei: repair?.device_imei || '',
        passcode: repair?.passcode || '',
        date_received: repair?.date_received || '',
        due_date: repair?.due_date || '',
        warranty_days: repair?.warranty_days ?? 0,
        warranty_until: repair?.warranty_until || '',
        notes: repair?.notes || ''
      });
      const [parts, setParts] = useState([]);
      const [partSel, setPartSel] = useState('');
      const [partQty, setPartQty] = useState(1);
      const set = (k, v) => setF({ ...f, [k]: v });
      const remaining = (Number(f.total_cost) || 0) - (Number(f.paid_amount) || 0);
      const statusOpts = [{ value:'in_repair', label:'In Repair' }, { value:'repaired', label:'Repaired' }, { value:'delivered', label:'Delivered' }];
      const priorityOpts = [{ value:'low', label:'Low' }, { value:'normal', label:'Normal' }, { value:'high', label:'High' }, { value:'urgent', label:'Urgent' }];

      const addPart = () => {
        if (!partSel) { Swal.fire({ icon:'warning', title:'Pick a part' }); return; }
        const q = parseInt(partQty) || 0;
        if (q <= 0) { Swal.fire({ icon:'warning', title:'Qty must be > 0' }); return; }
        const opt = partOpts.find(p => String(p.value) === String(partSel));
        setParts([...parts, { product_id: partSel, name: opt ? opt.label : partSel, qty_used: q }]);
        setPartSel(''); setPartQty(1);
      };
      const rmPart = (i) => setParts(parts.filter((_, idx) => idx !== i));

      const submit = (e) => {
        e.preventDefault();
        if (!f.customer_id) { Swal.fire({ icon:'warning', title:'Customer required' }); return; }
        if (!f.device_name.trim()) { Swal.fire({ icon:'warning', title:'Device name required' }); return; }
        const common = { device_name: f.device_name, brand: f.brand, model: f.model, color: f.color, problem_description: f.problem_description, diagnosis: f.diagnosis, priority: f.priority, total_cost: f.total_cost, labor_cost: f.labor_cost, paid_amount: f.paid_amount, status: f.status, device_imei: f.device_imei, passcode: f.passcode, date_received: f.date_received, due_date: f.due_date, warranty_days: f.warranty_days, warranty_until: f.warranty_until, notes: f.notes };

        if (editing) {
          onSave(common);
        } else {
          onSave({ ...common, customer_id: f.customer_id, parts: parts.map(p => ({ product_id: p.product_id, qty_used: p.qty_used })) });

      };

                  <div className="form-group"><label><i className="fas fa-coins"></i> Total Cost</label><input type="number" step="0.01" min="0" value={f.total_cost} onChange={(e) => set('total_cost', e.target.value)} /></div>

                  <div className="form-group"><label><i className="fas fa-barcode"></i> Device IMEI</label><input type="text" value={f.device_imei} onChange={(e) => set('device_imei', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-key"></i> Passcode</label><input type="text" value={f.passcode} onChange={(e) => set('passcode', e.target.value)} placeholder="to unlock device" /></div>
                  <div className="form-group"><label><i className="fas fa-calendar-day"></i> Due Date</label><input type="date" value={f.due_date} onChange={(e) => set('due_date', e.target.value)} /></div>
                  <div className="form-group"><label><i className="fas fa-shield-halved"></i> Warranty (days)</label><input type="number" min="0" value={f.warranty_days} onChange={(e) => set('warranty_days', e.target.value)} /></div>
                  <div className="form-group" style={{gridColumn:'1 / -1'}}><label><i className="fas fa-note-sticky"></i> Notes</label><textarea rows="2" value={f.notes} onChange={(e) => set('notes', e.target.value)}></textarea></div>

                    <div style={{display:'flex', gap:'8px', alignItems:'flex-end', flexWrap:'wrap'}}>

                      <input type="number" min="1" value={partQty} onChange={(e) => setPartQty(e.target.value)} style={{width:'80px'}} />
                      <button type="button" className="btn btn-secondary" onClick={addPart}><i className="fas fa-plus"></i> Add</button>
                    </div>
                    {parts.length > 0 && <div style={{display:'flex', flexWrap:'wrap', gap:'6px', marginTop:'10px'}}>
                      {parts.map((p, i) => <span key={i} className="pill" style={{display:'inline-flex', alignItems:'center', gap:'6px'}}>{p.name} × {p.qty_used}<i className="fas fa-xmark" style={{cursor:'pointer'}} onClick={() => rmPart(i)}></i></span>)}
                    </div>}
                  </div>
                )}

                {editing && repair.parts && repair.parts.length > 0 && (
                  <div style={{marginTop:'12px', borderTop:'1px solid #e5e7eb', paddingTop:'12px'}}>
                    <label style={{display:'flex', alignItems:'center', gap:'6px', fontWeight:600, marginBottom:'8px'}}><i className="fas fa-screwdriver"></i> Parts Used</label>
                    <div style={{display:'flex', flexWrap:'wrap', gap:'6px'}}>

    // ============== Inventory Movements ==============
    // stock adjustment modal — product picker (SearchableDropdown), qty change, note
    function AdjustModal({ products, userId, onClose, onDone }) {
      const [productId, setProductId] = useState('');
      const [qty, setQty] = useState('');
      const [note, setNote] = useState('');
      const [supplierId, setSupplierId] = useState('');
      const [invoiceNo, setInvoiceNo] = useState('');
      const [proof, setProof] = useState('');
      const [uploading, setUploading] = useState(false);
      const [busy, setBusy] = useState('');

      const { data: supRes } = useSWR('suppliers:all', () => gsRun('getSuppliers', userId), { revalidateOnFocus:false });
      const suppliers = supRes && supRes.success ? supRes.data : [];
      const supplierOpts = [{ value:'', label:'No Supplier (Direct Adjustment)' }].concat(
        suppliers.map(s => ({ value:s.id, label:s.name + (s.company ? ' (' + s.company + ')' : '') }))
      );

      const opts = products.map(p => ({ value:p.id, label:`${p.name} (${p.stock_qty} in stock)` }));
      const cur = products.find(p => String(p.id) === String(productId));
      const q = parseInt(qty) || 0;
      const isPurchase = q > 0;

      const handleProofUpload = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setUploading(true);
        try {
          const compressed = await compressImage(file, 450, 450, 0.7);
          setProof(compressed);
        } catch (err) {
          console.error("Proof compression failed:", err);
        } finally {
          setUploading(false);
        }
      };

      const submit = (e) => {
        e.preventDefault();
        if (!productId) { Swal.fire({ icon:'warning', title:'Pick a product' }); return; }
        if (!q) { Swal.fire({ icon:'warning', title:'Enter a non-zero qty change' }); return; }
        setBusy('Adjusting…');
        gsRun('adjustStock', Number(productId), q, note, supplierId || null, invoiceNo, proof, userId).then(rr => {
          setBusy('');
          if (rr.success) { Swal.fire({ icon:'success', title:'Stock adjusted', timer:1100, showConfirmButton:false }); onDone(); onClose(); }
          else Swal.fire({ icon:'error', title:'Error', text:rr.message });
        });
      };
      return (
        <div className="modal-overlay" onClick={onClose}>
          <LoadingPopup text={busy} />
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth:'480px'}}>
            <div className="modal-header"><h3><i className="fas fa-arrows-up-down"></i> New Stock Adjustment</h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <form onSubmit={submit}>
                <div className="form-group"><label><i className="fas fa-box"></i> Product *</label><SearchableDropdown options={opts} value={productId} onChange={setProductId} placeholder="Select product" /></div>
                {cur && <div className="form-group" style={{margin:'-4px 0 10px'}}><span style={{fontSize:'13px', color:'#667'}}>Current stock: <b>{cur.stock_qty}</b></span></div>}
                <div className="form-group"><label><i className="fas fa-arrow-up-1-9"></i> Qty Change *</label><input type="number" value={qty} onChange={(e) => setQty(e.target.value)} placeholder="e.g. 5 to add, -2 to remove" /></div>
                
                {isPurchase && (
                  <>
                    <div className="form-group"><label><i className="fas fa-truck-field"></i> Supplier</label><SearchableDropdown options={supplierOpts} value={supplierId} onChange={setSupplierId} placeholder="Select Supplier" /></div>
                    <div className="form-group"><label><i className="fas fa-file-invoice"></i> Supplier Bill / Invoice No.</label><input type="text" value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} placeholder="Invoice #" /></div>
                    <div className="form-group">
                      <label><i className="fas fa-camera"></i> Upload Bill / Invoice Proof</label>
                      <input type="file" className="file-input" accept="image/*" onChange={handleProofUpload} />
                      {uploading && <small style={{color:'var(--navy-accent)', display:'block'}}>Compressing bill...</small>}
                      {proof && (
                        <div style={{marginTop:'8px', textAlign:'center'}}>
                          <img src={proof} alt="Bill proof preview" style={{maxWidth:'100%', maxHeight:'120px', borderRadius:'6px', border:'1px solid rgba(255,255,255,0.1)'}} />
                          <button type="button" className="btn btn-secondary btn-sm" onClick={() => setProof('')} style={{display:'block', margin:'4px auto 0', padding:'2px 8px', fontSize:'11px'}}><i className="fas fa-trash"></i> Remove Bill</button>
                        </div>
                      )}
                    </div>
                  </>
                )}

                <div className="form-group"><label><i className="fas fa-note-sticky"></i> Note</label><input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Reason (optional)" /></div>
                <div className="form-actions" style={{marginTop:'15px'}}><button type="submit" className="btn btn-primary" disabled={uploading}><i className="fas fa-check"></i> Apply</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
              </form>
            </div>
          </div>
        </div>
      );
    }
    function InventoryView({ userId, role, perms }) {
      const canAdjust = can(perms, 'inventory', 'a');
      const [from, setFrom] = useState('');
      const [to, setTo] = useState('');
      const { data: res, mutate } = useSWR(`inventory:${from}:${to}`, () => gsRun('getInventoryMovements', userId, from || null, to || null), { revalidateOnFocus:false });
      const { data: prodRes } = useSWR('products:all', () => gsRun('getProducts', userId), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const products = prodRes && prodRes.success ? prodRes.data : [];
      const [showAdjust, setShowAdjust] = useState(false);

      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Access', text:res.message }); }, [res]);

      const cols = [
        { data:'created', title:'Date', render:(d) => fmtDate(d) },
        { data:'product_name', title:'Product' },
        { data:'movement_type', title:'Type', render:(d) => `<span class="status-badge">${(d || '').replace('_', ' ')}</span>` },
        { data:'qty_change', title:'Qty', render:(q) => Number(q) > 0

        { data:'supplier_name', title:'Supplier', render:(d) => esc(d) || '—' },
        { data:'invoice_no', title:'Invoice / Bill', render:(d) => esc(d) || '—' },
        { data:null, title:'Bill Proof', orderable:false, render:(d, t, r) =>

        },
        { data:'user_name', title:'User' },
        { data:'note', title:'Note' }
      ];
      const onAction = (action, row) => {

            imageAlt: 'Bill proof',
            confirmButtonText: 'Close',
            confirmButtonColor: 'var(--navy-primary)'
          });

      };
      useDataTable('inventoryTable', rows, cols, { onAction, onRefresh:() => mutate() });

      const openAdjust = () => {
        if (!products.length) { Swal.fire({ icon:'warning', title:'No products', text:'Add a product first' }); return; }
        setShowAdjust(true);
      };

      return (
        <div className="data-section">
          <div className="section-header" style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px', flexWrap:'wrap', gap:'10px'}}>
            <h2 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', margin:0}}><i className="fas fa-warehouse"></i> Inventory Movements</h2>
            <div style={{display:'flex', alignItems:'flex-end', gap:'10px', flexWrap:'wrap'}}>
              <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-day"></i> From</label><input type="date" value={from} onChange={(e) => setFrom(e.target.value)} /></div>
              <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-day"></i> To</label><input type="date" value={to} onChange={(e) => setTo(e.target.value)} /></div>
              {canAdjust && <button className="btn btn-primary" onClick={openAdjust}><i className="fas fa-plus"></i> New Adjustment</button>}
            </div>
          </div>
          {rows === undefined ? <TableSkeleton rows={6} columns={6} /> : <table id="inventoryTable" className="display" style={{width:'100%'}}></table>}
          {showAdjust && <AdjustModal products={products} userId={userId} onClose={() => setShowAdjust(false)} onDone={mutate} />}
        </div>
      );
    }

    // ============== Reports (KPIs + breakdowns over a date range) ==============
    // ============== Expenses ==============
    function ExpensesView({ userId, role, perms }) {
      const canAdd = can(perms, 'expenses', 'a'), canEdit = can(perms, 'expenses', 'e'), canDel = can(perms, 'expenses', 'd');
      const [from, setFrom] = useState(monthStart());
      const [to, setTo] = useState(todayStr());
      const [cat, setCat] = useState('');
      const { data: res, mutate } = useSWR(`expenses:${from}:${to}`, () => gsRun('getExpenses', userId, from || null, to || null), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const [show, setShow] = useState(false);
      const [editing, setEditing] = useState(null);
      const [busy, setBusy] = useState('');
      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Access', text:res.message }); }, [res]);
      const catList = ((window.SHOP && window.SHOP.expense_categories) || 'rent,salaries,utilities,marketing,parts,misc').split(',').map(s => s.trim()).filter(Boolean);
      const catOpts = [{ value:'', label:'All Categories' }].concat(catList.map(c => ({ value:c, label:c })));
      const cols = [
        { data:'id', title:'ID' },
        { data:'date', title:'Date', render:(d) => fmtDay(d) },
        { data:'category', title:'Category', render:(d) => `<span class="status-badge">${esc(d)}</span>` },
        { data:'payee', title:'Payee', render:(d) => esc(d) || '—' },
        { data:'amount', title:'Amount', render:(v) => money(v) },
        { data:'payment_method', title:'Method', render:(d) => esc((d || '').replace('_', ' ')) },
        { data:'note', title:'Note', render:(d) => esc(d) || '—' },
        { data:'user_name', title:'Added By', render:(d) => esc(d) },
        { data:null, title:'Actions', orderable:false, render:() =>
          ((canEdit ? '<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>' : '') +
           (canDel ? '<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>' : '')) || '—' }
      ];
      const onAction = (action, row) => {
        if (action === 'edit') { setEditing(row); setShow(true); }
        else if (action === 'delete') {
          Swal.fire({ icon:'warning', title:'Delete expense?', text:money(row.amount) + ' · ' + row.category, showCancelButton:true, confirmButtonColor:'var(--danger)', confirmButtonText:'Delete' }).then(r => {
            if (r.isConfirmed) { setBusy('Deleting…'); gsRun('deleteExpense', row.id, userId).then(rr => { setBusy(''); if (rr.success) { Swal.fire({ icon:'success', title:'Deleted', timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:rr.message }); }); }
          });
        }
      };
      const shown = rows === undefined ? undefined : (cat ? rows.filter(r => r.category === cat) : rows);
      useDataTable('expensesTable', shown, cols, { onAction, onRefresh:() => mutate() });
      const total = (shown || []).reduce((a, e) => a + Number(e.amount || 0), 0);
      const save = (form) => {
        setBusy(editing ? 'Updating…' : 'Saving…');
        const p = editing ? gsRun('updateExpense', editing.id, form, userId) : gsRun('addExpense', form, userId);
        p.then(r => { setBusy(''); if (r.success) { setShow(false); setEditing(null); Swal.fire({ icon:'success', title:r.message, timer:1100, showConfirmButton:false }); mutate(); } else Swal.fire({ icon:'error', title:'Error', text:r.message }); });
      };
      return (
        <div className="data-section">
          <LoadingPopup text={busy} />
          <div className="section-header" style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:'14px', flexWrap:'wrap', gap:'10px'}}>
            <h2 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', margin:0}}><i className="fas fa-file-invoice-dollar"></i> Expenses</h2>
            <div style={{display:'flex', alignItems:'flex-end', gap:'10px', flexWrap:'wrap'}}>
              <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-day"></i> From</label><input type="date" value={from} max={to} onChange={(e) => setFrom(e.target.value)} /></div>
              <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-check"></i> To</label><input type="date" value={to} min={from} onChange={(e) => setTo(e.target.value)} /></div>
              <div className="form-group" style={{margin:0, minWidth:'170px'}}><label><i className="fas fa-tag"></i> Category</label><SearchableDropdown options={catOpts} value={cat} onChange={setCat} placeholder="All Categories" /></div>
              {canAdd && <button className="btn btn-primary" onClick={() => { setEditing(null); setShow(true); }}><i className="fas fa-plus"></i> Add Expense</button>}
            </div>
          </div>
          <div className="lte-kpi-grid" style={{marginBottom:'14px'}}>
            <SmallBox value={money(total)} label="Total Expenses" icon="fa-money-bill-wave" color="bg-warning" />
            <InfoBox value={(shown || []).length} label="Entries" icon="fa-list" color="bg-info" />
          </div>
          {rows === undefined ? <TableSkeleton rows={6} columns={8} /> : <table id="expensesTable" className="display" style={{width:'100%'}}></table>}
          {show && <ExpenseModal expense={editing} catList={catList} onClose={() => { setShow(false); setEditing(null); }} onSave={save} />}
        </div>
      );
    }
    function ExpenseModal({ expense, catList, onClose, onSave }) {

      });

      return (

          <div className="modal" onClick={(ev) => ev.stopPropagation()} style={{maxWidth:'520px'}}>

            <div className="modal-body">
              <form onSubmit={(ev) => { ev.preventDefault(); if (!(Number(f.amount) > 0)) { Swal.fire({ icon:'warning', title:'Amount must be > 0' }); return; } onSave(f); }}>
                <div className="form-grid">
                  <div className="form-group"><label><i className="fas fa-calendar-day"></i> Date *</label><input type="date" value={f.date} onChange={(e) => set('date', e.target.value)} required /></div>
                  <div className="form-group"><label><i className="fas fa-tag"></i> Category</label><SearchableDropdown options={catOpts} value={f.category} onChange={(v) => set('category', v)} placeholder="Category" /></div>
                  <div className="form-group"><label><i className="fas fa-coins"></i> Amount *</label><input type="number" step="0.01" min="0" value={f.amount} onChange={(e) => set('amount', e.target.value)} required /></div>
                  <div className="form-group"><label><i className="fas fa-wallet"></i> Method</label><SearchableDropdown options={methodOpts} value={f.payment_method} onChange={(v) => set('payment_method', v)} placeholder="Method" /></div>
                  <div className="form-group"><label><i className="fas fa-user"></i> Payee</label><input type="text" value={f.payee} onChange={(e) => set('payee', e.target.value)} /></div>
                  <div className="form-group" style={{gridColumn:'1 / -1'}}><label><i className="fas fa-note-sticky"></i> Note</label><textarea rows="2" value={f.note} onChange={(e) => set('note', e.target.value)}></textarea></div>
                </div>
                <div className="form-actions"><button type="submit" className="btn btn-primary"><i className="fas fa-save"></i> Save</button><button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button></div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============== Reports (KPIs + breakdowns over a date range) ==============
    function ReportsView({ userId, role, perms }) {
      const canView = can(perms, 'reports', 'v');
      const today = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const [from, setFrom] = useState(ymd(new Date(today.getFullYear(), today.getMonth(), 1)));
      const [to, setTo] = useState(ymd(today));
      const [data, setData] = useState(null);
      const [busy, setBusy] = useState('');

      const load = () => {
        if (!from || !to) { Swal.fire({ icon:'warning', title:'Pick both dates' }); return; }
        if (from > to) { Swal.fire({ icon:'warning', title:'From date is after To date' }); return; }
        setBusy('Loading report…');
        gsRun('getReportSummary', userId, from, to).then(r => {
          setBusy('');
          if (r.success) setData(r.data);
          else { setData(null); Swal.fire({ icon:'error', title:'Error', text:r.message }); }
        });
      };

      useEffect(() => { if (canView) load(); }, []);

      if (!canView) return <NoAccessView />;

      const d = data;
      const bp = (d && d.byPayment) || {};

      return (
        <div className="data-section">
          <LoadingPopup text={busy} />
          <div className="section-header" style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:'16px', flexWrap:'wrap', gap:'12px'}}>
            <h2 style={{display:'flex', alignItems:'center', gap:'8px', color:'var(--navy-primary)', margin:0}}><i className="fas fa-chart-pie"></i> Reports</h2>
            <div style={{display:'flex', alignItems:'flex-end', gap:'10px', flexWrap:'wrap'}}>
              <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-day"></i> From</label><input type="date" value={from} max={to} onChange={(e) => setFrom(e.target.value)} /></div>
              <div className="form-group" style={{margin:0}}><label><i className="fas fa-calendar-check"></i> To</label><input type="date" value={to} min={from} onChange={(e) => setTo(e.target.value)} /></div>
              <button className="btn btn-primary" onClick={load}><i className="fas fa-play"></i> Run</button>
            </div>
          </div>

          {busy && !d ? <ReportSkeleton /> : !d ? (

    // ============== Settings ==============
    // module-level (NOT defined inside SettingsView — avoids remount/focus-loss on every keystroke)
    function SettingsCard({ s, isDirty, canEditShop, dis, onSave, children }) {
      return (
        <div className="settings-card">
          <div className="settings-card-head">
            <span className="ic"><i className={'fas ' + s.icon}></i></span>
            <div><h3 className="settings-card-title">{s.label}</h3><p className="settings-card-sub">{s.sub}</p></div>
            {s.keys.length > 0 && isDirty && <span className="settings-dirty-pill"><i className="fas fa-circle-exclamation"></i> Unsaved changes</span>}
          </div>
          <div className="settings-card-body">{children}</div>
          {s.keys.length > 0 && (
            <div className="settings-card-foot">
              {!canEditShop && <span className="hint"><i className="fas fa-lock"></i> View only — owner can edit</span>}
              <button className="btn btn-primary" disabled={dis || !isDirty} onClick={onSave}><i className="fas fa-save"></i> Save {s.label}</button>
            </div>
          )}
        </div>
      );
    }
    function SettingsView({ userId, role, perms, onSettingsUpdate }) {
      const canEditShop = can(perms, 'settings', 'e');
      const [shop, setShop] = useState(null);
      const [base, setBase] = useState(null);
      const [section, setSection] = useState('shop_profile');
      const [profileImg, setProfileImg] = useState('');
      const [busy, setBusy] = useState('');

      const currencyPresets = [
        { symbol: '₹', code: 'INR', position: 'before', label: 'INR (₹)' },
        { symbol: '€', code: 'EUR', position: 'before', label: 'EUR (€)' },
        { symbol: '$', code: 'USD', position: 'before', label: 'USD ($)' },
        { symbol: '£', code: 'GBP', position: 'before', label: 'GBP (£)' }
      ];

      useEffect(() => {
        gsRun('getShopSettings').then(r => { if (r.success) { setShop(r.data || {}); setBase(r.data || {}); } });
        gsRun('getUserSettings', userId).then(r => { if (r.success && r.settings) setProfileImg(r.settings.profileImage || ''); });
      }, [userId]);

      const f = shop || {};
      const dis = !canEditShop;
      const set = (k, v) => setShop(s => ({ ...(s || {}), [k]: v }));
      const setT = (k, on) => set(k, on ? '1' : '0');
      const on = (k) => String(f[k]) === '1';
      const pick = (keys) => keys.reduce((o, k) => (o[k] = f[k], o), {});
      const dirty = (keys) => !!base && keys.some(k => String(f[k] ?? '') !== String(base[k] ?? ''));
      const refreshShopGlobal = (s) => { window.SHOP = buildShopGlobal(s); };

      const saveSection = (keys) => {
        setBusy('Saving…');
        gsRun('saveShopSettings', pick(keys), userId).then(r => {
          setBusy('');
          if (!r.success) return Swal.fire({ icon:'error', title:'Error', text:r.message });
          setBase(b => ({ ...(b || {}), ...pick(keys) }));
          refreshShopGlobal({ ...(base || {}), ...(shop || {}) });
          onSettingsUpdate && onSettingsUpdate();
          Swal.fire({ icon:'success', title:'Saved', timer:1000, showConfirmButton:false });
        });
      };

      const readBase64 = (file) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(file); });
      const handleLogo = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setBusy('Uploading logo…');
        try {
          const base64 = await compressImage(file, 200, 200, 0.7);
          const r = await gsRun('uploadShopLogo', base64, file.name, userId);
          if (r.success) {
            const next = { ...(shop || {}), shop_logo: r.fileUrl };
            await gsRun('saveShopSettings', { shop_logo: r.fileUrl }, userId);
            setBusy(''); setShop(next); setBase(b => ({ ...(b || {}), shop_logo: r.fileUrl })); refreshShopGlobal(next);
            Swal.fire({ icon:'success', title:'Logo updated', timer:1100, showConfirmButton:false });
            onSettingsUpdate && onSettingsUpdate();
          } else {
            setBusy('');
            Swal.fire({ icon:'error', title:'Upload failed', text:r.message });
          }
        } catch (err) {
          setBusy('');
          console.error(err);
          Swal.fire({ icon:'error', title:'Upload error', text: err.message || 'Failed to save logo. Image might be too large (>1MB) if Firebase Storage is disabled.' });
        }
        e.target.value = '';
      };
      const handleFile = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setBusy('Uploading…');
        try {
          const base64 = await compressImage(file, 200, 200, 0.7);
          const r = await gsRun('uploadProfileImage', base64, file.name, userId);
          if (r.success) {
            await gsRun('updateUserSettings', userId, { profileImage: r.fileUrl });
            setBusy(''); setProfileImg(r.fileUrl);
            Swal.fire({ icon:'success', title:'Profile photo updated', timer:1100, showConfirmButton:false });
            onSettingsUpdate && onSettingsUpdate();
          } else {
            setBusy('');
            Swal.fire({ icon:'error', title:'Upload failed', text:r.message });
          }
        } catch (err) {
          setBusy('');
          console.error(err);
          Swal.fire({ icon:'error', title:'Upload error', text: err.message || 'Failed to save photo. Image might be too large (>1MB) if Firebase Storage is disabled.' });
        }
        e.target.value = '';
      };

      const posOpts = [{ value:'before', label:'Symbol before — €100' }, { value:'after', label:'Symbol after — 100 €' }];
      const dateOpts = [{ value:'YYYY-MM-DD', label:'YYYY-MM-DD' }, { value:'DD/MM/YYYY', label:'DD/MM/YYYY' }, { value:'MM/DD/YYYY', label:'MM/DD/YYYY' }];
      const sizeOpts = [{ value:'58mm', label:'58 mm thermal' }, { value:'80mm', label:'80 mm thermal' }];
      const tzList = ['Asia/Karachi','Asia/Dubai','Asia/Kolkata','Europe/London','Europe/Berlin','America/New_York','America/Los_Angeles','Africa/Lagos','Australia/Sydney'];
      const tzOpts = [...new Set([f.timezone, ...tzList].filter(Boolean))].map(t => ({ value:t, label:t }));

      const SECTIONS = [
        { key:'shop_profile', label:'Shop Profile', icon:'fa-store', sub:'Identity shown on receipts & login', keys:['shop_name','shop_tagline','shop_address','shop_city','shop_country','shop_phone','shop_email','shop_website','tax_id','shop_logo'] },
        { key:'localization', label:'Localization & Tax', icon:'fa-globe', sub:'Currency, VAT, dates & timezone', keys:['currency','currency_code','currency_position','currency_decimals','vat_default','enable_vat','low_stock_default','timezone','date_format'] },
        { key:'receipts', label:'Receipts & Invoicing', icon:'fa-receipt', sub:'Document size, footer, terms & numbering', keys:['receipt_size','receipt_footer','invoice_prefix','repair_prefix','used_prefix','show_logo_on_receipt','invoice_terms','contract_terms'] },
        { key:'loyalty', label:'Loyalty', icon:'fa-star', sub:'Points earning & redemption value', keys:['loyalty_enabled','loyalty_earn_per','loyalty_point_value'] },
        { key:'notifications', label:'Notifications', icon:'fa-bell', sub:'WhatsApp message template', keys:['wa_template','installment_reminder_email'] },
        { key:'my_profile', label:'My Profile', icon:'fa-circle-user', sub:'Your personal photo', keys:[] }

      const cur = SECTIONS.find(s => s.key === section) || SECTIONS[0];

      return (
